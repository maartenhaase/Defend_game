<style>
:root{--ink:#18324b;--muted:#617a91;--card:#fffffff4;--line:#d9eaf5;--blue:#55baf8;--green:#5fd586;--green2:#45c971;--yellow:#ffd95d;--pink:#ff9ecb;--red:#ff8585;--bg1:#8edcff;--bg2:#fff2a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation}body{margin:0;min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));overscroll-behavior-y:none}.app{max-width:800px;margin:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom))}.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:32px;box-shadow:0 10px 24px #0001}h1{font-size:25px;margin:0 0 4px;font-weight:1000}.sub{font-size:13px;color:var(--muted);font-weight:800}.card{background:var(--card);border:2px solid #fff;border-radius:24px;padding:16px;box-shadow:0 14px 30px #0001;margin-bottom:12px}.section{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.section h2{font-size:20px;margin:0}.tiny{font-size:12px;color:var(--muted);font-weight:800}.muted{color:var(--muted)}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.btn{border:0;border-radius:18px;padding:15px 16px;min-height:52px;font-size:17px;font-weight:1000;color:var(--ink);background:#fff;box-shadow:0 8px 18px #0001;touch-action:manipulation;-webkit-user-select:none;user-select:none}.btn.primary{background:linear-gradient(#68dc90,#47c973);color:#113b1e}.btn.blue{background:linear-gradient(#78ccff,#4baefa);color:#0b3653}.btn.yellow{background:linear-gradient(#ffe985,#ffd34b)}.btn.pink{background:linear-gradient(#ffc0dc,#ff9ac6)}.btn.small{min-height:44px;padding:10px 12px;font-size:13px}.btn:active,.pill:active{transform:scale(.985)}input,select{width:100%;padding:14px 12px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:17px;color:var(--ink)}label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin:0 0 5px 3px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields .full{grid-column:1/-1}.pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pill{border:0;border-radius:17px;padding:12px 8px;min-height:48px;font-size:14px;font-weight:1000;background:#fff;color:var(--ink);touch-action:manipulation}.pill.active{background:var(--blue);color:#fff}.question-card{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}.category{display:inline-block;background:#eef8ff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:1000;margin-bottom:12px}.question{font-size:34px;line-height:1.12;font-weight:1000;letter-spacing:-.5px;margin:8px 0 16px}.helper{font-size:17px;line-height:1.35;color:var(--muted);font-weight:800;max-width:560px}.answer-box{margin-top:16px;width:100%;background:#f5fff7;border:3px solid #bfeecb;border-radius:22px;padding:16px}.answer-title{font-size:12px;color:#4d7a59;font-weight:1000;text-transform:uppercase;letter-spacing:.6px}.answer{font-size:28px;line-height:1.1;font-weight:1000;margin-top:5px}.follow{font-size:15px;line-height:1.35;color:#50725a;font-weight:800;margin-top:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stars{display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:9px 13px;font-size:16px;font-weight:1000;box-shadow:0 6px 14px #0001}.progress{height:9px;background:#eaf1f6;border-radius:999px;overflow:hidden;margin:10px 0 0}.progress>div{height:100%;background:#5fcf82;width:0%;transition:.2s}.big-result{text-align:center;padding:26px 18px}.big-result .big{font-size:64px}.big-result h2{font-size:30px;margin:8px 0}.big-result p{font-size:18px;line-height:1.4;color:var(--muted);font-weight:800}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#21364a;color:#fff;border-radius:14px;padding:12px 15px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}@media(max-width:580px){.fields{grid-template-columns:1fr}.fields .full{grid-column:auto}.question-card{min-height:400px}.question{font-size:30px}.controls{grid-template-columns:1fr}.pills{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="brand"><div class="logo">⭐</div><div><h1>Kleuterquiz</h1><div class="sub">makkelijk • grappig • persoonlijk</div></div></div><button id="resetBtn" class="btn small" type="button">reset</button></div>

<section id="setupScreen">
<div class="card"><div class="section"><h2>Wie spelen er mee?</h2><span class="tiny">voor de persoonlijke vragen</span></div><div class="fields"><div><label>Naam kind</label><input id="childName" value="Floor"></div><div><label>Mama</label><input id="mamaName" value="Eline"></div><div><label>Papa</label><input id="papaName" value="Maarten"></div><div><label>Aantal vragen</label><select id="questionCount"><option value="10">10 vragen</option><option selected value="20">20 vragen</option><option value="30">30 vragen</option><option value="999">Blijven spelen</option></select></div></div></div>
<div class="card"><div class="section"><h2>Soort vragen</h2><span class="tiny">alles staat standaard aan</span></div><div id="catPills" class="pills"></div></div>
<button id="startBtn" class="btn primary" style="width:100%;font-size:20px" type="button">Start de quiz</button>
</section>

<section id="quizScreen" class="hidden">
<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="stars">⭐ <span id="stars">0</span></div><div class="tiny" id="counter"></div></div>
<div class="card question-card"><div id="category" class="category"></div><div id="question" class="question"></div><div id="helper" class="helper"></div><div id="answerBox" class="answer-box hidden"><div class="answer-title">Antwoord</div><div id="answer" class="answer"></div><div id="follow" class="follow"></div></div></div>
<div class="progress"><div id="progressBar"></div></div>
<div class="controls"><button id="speakBtn" class="btn blue" type="button">🔊 Lees voor</button><button id="answerBtn" class="btn yellow" type="button">Toon antwoord</button><button id="starBtn" class="btn pink" type="button">⭐ Goed gedaan</button><button id="nextBtn" class="btn primary" type="button">Volgende vraag →</button></div>
</section>

<section id="doneScreen" class="hidden"><div class="card big-result"><div class="big">🎉</div><h2>Super gedaan!</h2><p><span id="doneName"></span> heeft <b><span id="doneStars"></span> sterren</b> verzameld.</p><button id="againBtn" class="btn primary" style="width:100%;margin-top:8px">Nog een ronde</button><button id="settingsBtn" class="btn" style="width:100%;margin-top:8px">Instellingen</button></div></section>
</div><div id="toast" class="toast"></div>

{c:'Over jou',q:'Hoe heet jij?',a:'{child}',t:'personal',f:'Kun je je naam heel hard zeggen?'},{c:'Over jou',q:'Hoe oud ben jij?',a:'Jouw eigen antwoord',t:'personal',f:'Kun je dat aantal vingers opsteken?'},{c:'Over jou',q:'Wat is jouw lievelingskleur?',a:'Jouw eigen antwoord',t:'personal',f:'Kun je iets aanwijzen met die kleur?'},{c:'Over jou',q:'Wat eet jij het allerliefst?',a:'Jouw eigen antwoord',t:'personal',f:'Zou je dat elke dag willen eten?'},{c:'Over jou',q:'Wat is jouw favoriete speelgoed?',a:'Jouw eigen antwoord',t:'personal',f:'Wat kun je ermee doen?'},{c:'Over jou',q:'Waar moet jij heel hard om lachen?',a:'Jouw eigen antwoord',t:'personal',f:'Kun je je gekste lach laten horen?'},{c:'Over jou',q:'Wat vind jij leuk om buiten te doen?',a:'Jouw eigen antwoord',t:'personal',f:'Met wie doe je dat graag?'},{c:'Over jou',q:'Welk dier vind jij het leukste?',a:'Jouw eigen antwoord',t:'personal',f:'Kun je dat dier nadoen?'},{c:'Over jou',q:'Wat kun jij al heel goed?',a:'Jouw eigen antwoord',t:'personal',f:'Laat maar zien als dat kan!'},{c:'Over jou',q:'Waar slaap jij mee in bed?',a:'Jouw eigen antwoord',t:'personal',f:'Knuffel, deken of iets anders?'},{c:'Over jou',q:'Wat wil jij later misschien worden?',a:'Jouw eigen antwoord',t:'personal',f:'Waarom lijkt je dat leuk?'},{c:'Over jou',q:'Wat is het leukste dat je vandaag hebt gedaan?',a:'Jouw eigen antwoord',t:'personal',f:'Wie was daar ook bij?'},

// Eten
{c:'Eten',q:'Is een appel fruit of speelgoed?',a:'Fruit'},{c:'Eten',q:'Waar komt melk vaak vandaan?',a:'Van een koe'},{c:'Eten',q:'Wat doe je op brood: sokken of beleg?',a:'Beleg'},{c:'Eten',q:'Is ijs meestal warm of koud?',a:'Koud'},{c:'Eten',q:'Wat drink je uit een beker?',a:'Drinken / water / melk'},{c:'Eten',q:'Welke is groente: wortel of koekje?',a:'Wortel'},{c:'Eten',q:'Welke is fruit: banaan of kaas?',a:'Banaan'},{c:'Eten',q:'Wat vind jij lekkerder: pannenkoek of broccoli?',a:'Jouw eigen antwoord',t:'personal'},{c:'Eten',q:'Wat zou jij kiezen als toetje?',a:'Jouw eigen antwoord',t:'personal'},{c:'Eten',q:'Waar eet je soep mee?',a:'Met een lepel'},{c:'Eten',q:'Kan je een vork gebruiken om spaghetti te eten?',a:'Ja'},{c:'Eten',q:'Wat eet jij graag als ontbijt?',a:'Jouw eigen antwoord',t:'personal'},
// Lichaam
{c:'Lichaam',q:'Waarmee kun je ruiken?',a:'Met je neus'},{c:'Lichaam',q:'Waarmee kun je kijken?',a:'Met je ogen'},{c:'Lichaam',q:'Waarmee kun je luisteren?',a:'Met je oren'},{c:'Lichaam',q:'Waarmee kun je proeven?',a:'Met je tong'},{c:'Lichaam',q:'Waarmee loop je?',a:'Met je benen en voeten'},{c:'Lichaam',q:'Waarmee klap je?',a:'Met je handen'},{c:'Lichaam',q:'Waar zitten je knieën?',a:'Aan je benen'},{c:'Lichaam',q:'Kun je met je tenen wiebelen?',a:'Ja',t:'personal'},{c:'Lichaam',q:'Kun je je tong uitsteken?',a:'Ja',t:'personal'},{c:'Lichaam',q:'Kun je op één been staan?',a:'Probeer maar!',t:'personal'},{c:'Lichaam',q:'Waar zitten je haren?',a:'Op je hoofd'},{c:'Lichaam',q:'Waarmee geef je een kus?',a:'Met je mond / lippen'},

let enabled=new Set(Object.keys(CATS)), deck=[],index=0,stars=0,target=20,current=null;
const $=s=>document.querySelector(s), screens=['setupScreen','quizScreen','doneScreen'];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function show(id){screens.forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}function rnd(n){if(n<2)return 0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function names(){return{child:$('#childName').value.trim()||'jij',mama:$('#mamaName').value.trim()||'mama',papa:$('#papaName').value.trim()||'papa'}}function fill(t){const n=names();return String(t||'').replaceAll('{child}',n.child).replaceAll('{mama}',n.mama).replaceAll('{papa}',n.papa)}
function renderCats(){const box=$('#catPills');box.innerHTML=Object.entries(CATS).map(([c,i])=>'<button class="pill '+(enabled.has(c)?'active':'')+'" data-cat="'+esc(c)+'">'+i+' '+esc(c)+'</button>').join('');box.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;if(enabled.has(c)){if(enabled.size===1){toast('Laat minstens één categorie aan');return}enabled.delete(c)}else enabled.add(c);renderCats()})}
function start(){target=parseInt($('#questionCount').value,10);deck=shuffle(Q.filter(x=>enabled.has(x.c)));index=0;stars=0;$('#stars').textContent='0';show('quizScreen');nextQuestion()}
function nextQuestion(){if(!deck.length)deck=shuffle(Q.filter(x=>enabled.has(x.c)));if(target!==999&&index>=target){finish();return}current=deck.pop();index++;$('#category').textContent=CATS[current.c]+' '+current.c;$('#question').textContent=fill(current.q);$('#helper').textContent=current.t==='personal'?'Er is geen fout antwoord. Luister naar wat er verteld wordt.':'Laat eerst zelf antwoorden.';$('#answer').textContent=fill(current.a);$('#follow').textContent=fill(current.f||'');$('#answerBox').classList.add('hidden');$('#answerBtn').textContent=current.t==='personal'?'Laat kaartje zien':'Toon antwoord';$('#counter').textContent=target===999?('Vraag '+index):(index+' van '+target);$('#progressBar').style.width=target===999?'0%':Math.min(100,index/target*100)+'%'}
function finish(){$('#doneName').textContent=names().child;$('#doneStars').textContent=stars;show('doneScreen')}
function speak(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(fill(current.q));u.lang='nl-NL';u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
$('#startBtn').onclick=start;$('#answerBtn').onclick=()=>$('#answerBox').classList.toggle('hidden');$('#nextBtn').onclick=nextQuestion;$('#speakBtn').onclick=speak;$('#starBtn').onclick=()=>{stars++;$('#stars').textContent=stars;toast('Ster erbij! ⭐')};$('#againBtn').onclick=start;$('#settingsBtn').onclick=()=>show('setupScreen');$('#resetBtn').onclick=()=>{enabled=new Set(Object.keys(CATS));$('#childName').value='Floor';$('#mamaName').value='Eline';$('#papaName').value='Maarten';$('#questionCount').value='20';renderCats();show('setupScreen')};renderCats();show('setupScreen');
</script>
</body></html>
