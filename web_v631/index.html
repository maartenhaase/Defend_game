<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08120f"><title>JBD v6.3.1 Fix</title><style>html,body{margin:0;height:100%;background:#08120f;color:#efe5ca;font-family:ui-monospace,monospace}#l{height:100%;display:grid;place-items:center;text-align:center;letter-spacing:2px;font-weight:900;padding:24px;box-sizing:border-box}small{display:block;margin-top:18px;line-height:1.5;letter-spacing:1px;color:#c9c0a8}</style></head><body><div id="l">JBD v6.3.1<br>LOADING BATTLEFIELD...</div><script>(async()=>{const box=document.getElementById('l');try{const r=await fetch('../web_v63/index.html?fix=631',{cache:'no-store'});if(!r.ok)throw new Error('source '+r.status);const src=await r.text();const m=src.match(/const P='([^']+)'/);if(!m)throw new Error('game payload not found');let p=m[1].replace(/[^A-Za-z0-9+/=]/g,'');p=p.replace(/=+$/,'');while(p.length%4)p+='=';const bin=atob(p);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('Safari gzip support missing');const ds=new DecompressionStream('gzip');const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();const html=new TextDecoder('utf-8').decode(ab);if(!html.includes('JBD'))throw new Error('decoded game invalid');document.open();document.write(html);document.close()}catch(e){box.innerHTML='LOAD ERROR 6.3.1<small>'+String(e).replace(/[<>]/g,'')+'</small>'}})();</script></body></html>
