let enabled=new Set(Object.keys(CATS)),deck=[],index=0,stars=0,target=20,current=null;
const $=s=>document.querySelector(s),screens=['setupScreen','quizScreen','doneScreen'];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}function show(id){screens.forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}function rnd(n){if(n<2)return 0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function names(){return{child:$('#childName').value.trim()||'jij',mama:$('#mamaName').value.trim()||'mama',papa:$('#papaName').value.trim()||'papa'}}function fill(t){const n=names();return String(t||'').replaceAll('{child}',n.child).replaceAll('{mama}',n.mama).replaceAll('{papa}',n.papa)}
function renderCats(){const box=$('#catPills');box.innerHTML=Object.entries(CATS).map(([c,i])=>'<button class="pill '+(enabled.has(c)?'active':'')+'" data-cat="'+esc(c)+'">'+i+' '+esc(c)+'</button>').join('');box.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;if(enabled.has(c)){if(enabled.size===1){toast('Laat minstens één categorie aan');return}enabled.delete(c)}else enabled.add(c);renderCats()})}
function start(){target=parseInt($('#questionCount').value,10);deck=shuffle(Q.filter(x=>enabled.has(x.c)));index=0;stars=0;$('#stars').textContent='0';show('quizScreen');nextQuestion()}
function nextQuestion(){if(!deck.length)deck=shuffle(Q.filter(x=>enabled.has(x.c)));if(target!==999&&index>=target){finish();return}current=deck.pop();index++;$('#category').textContent=CATS[current.c]+' '+current.c;$('#question').textContent=fill(current.q);$('#helper').textContent=current.t==='personal'?'Geen fout antwoord — laat haar vertellen en doorvragen.':'Laat eerst zelf nadenken. Een hint geven mag natuurlijk.';$('#answer').textContent=fill(current.a);$('#follow').textContent=fill(current.f||'');$('#answerBox').classList.add('hidden');$('#answerBtn').textContent=current.t==='personal'?'Laat kaartje zien':'Toon antwoord';$('#counter').textContent=target===999?('Vraag '+index):(index+' van '+target);$('#progressBar').style.width=target===999?'0%':Math.min(100,index/target*100)+'%'}
function finish(){$('#doneName').textContent=names().child;$('#doneStars').textContent=stars;show('doneScreen')}
function speak(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(fill(current.q));u.lang='nl-NL';u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
$('#startBtn').onclick=start;$('#answerBtn').onclick=()=>$('#answerBox').classList.toggle('hidden');$('#nextBtn').onclick=nextQuestion;$('#speakBtn').onclick=speak;$('#starBtn').onclick=()=>{stars++;$('#stars').textContent=stars;toast('Ster erbij! ⭐')};$('#againBtn').onclick=start;$('#settingsBtn').onclick=()=>show('setupScreen');$('#resetBtn').onclick=()=>{enabled=new Set(Object.keys(CATS));$('#childName').value='Floor';$('#mamaName').value='Eline';$('#papaName').value='Maarten';$('#questionCount').value='20';renderCats();show('setupScreen')};renderCats();show('setupScreen');
