(() => {

  function init(s){s.particles=Array.from({length:C.render.particles},()=>({active:false}));s.particleCursor=0;}
  function emit(s,type,x,y,count,opts={}){
    const q=s.quality;count=Math.max(1,Math.floor(count*q));
    for(let i=0;i<count;i++){
      let p=null;
      for(let tries=0;tries<s.particles.length;tries++){const idx=(s.particleCursor++)%s.particles.length;if(!s.particles[idx].active){p=s.particles[idx];break;}}
      if(!p)return;
      const a=(opts.angle??Math.random()*Math.PI*2)+(Math.random()-.5)*(opts.arc??Math.PI*2),sp=J.U.rnd(opts.speedMin??18,opts.speedMax??95);

/* ===== infantry.js ===== */
(() => {
  const J=window.JBD, C=J.CONFIG, U=J.U;
  let nextId=1;
  const COVER_STATES=new Set(['ENTER_COVER','FIRE_FROM_COVER']);

  function spawn(s,x=null,y=null,opts={}){
    const r=s.rng,w=s.viewport.w;
    const e={
      id:nextId++,type:opts.type||'rifleman',x:x??(28+r()*(w-56)),y:y??(20+r()*18),vx:0,vy:0,
      angle:Math.PI/2,hp:C.infantry.hp,state:'ADVANCE',stateT:0,
      speed:C.infantry.speed*(.9+r()*.18),anim:r()*10,phase:r()*10,
      fireT:r()*.6,suppression:0,cover:null,coverT:0,hitT:0,deathT:0,
      fallDir:r()<.5?-1:1,alpha:1,coverIntent:opts.coverIntent??(r()<.72),reCoverT:opts.reCoverT||0,
      assaultT:0,muzzleT:0,recoilT:0
    };
    s.enemies.push(e);return e;
  }

  function findCover(s,e){
    let best=null,bestScore=-1e9;
    for(const c of s.cover){
      if(c.occupiedBy&&c.occupiedBy!==e.id)continue;
      const dx=c.x-e.x,dy=c.y-e.y,d=Math.hypot(dx,dy);
      if(d>C.infantry.coverSearchRadius||c.y<e.y-55||c.y>s.bunker.y-70)continue;
      let score=-d*.7+c.coverStrength*120+(c.y-e.y)*.18-c.danger*80;
      if(score>bestScore){bestScore=score;best=c;}
    }
    return best;
  }

  function transition(e,state){e.state=state;e.stateT=0;}
  function isCraterCovered(e){return COVER_STATES.has(e.state)&&!!e.cover;}

  function releaseFromCover(s,e){
    if(e.cover&&e.cover.occupiedBy===e.id)e.cover.occupiedBy=null;
    e.cover=null;
    e.coverIntent=false;
    e.reCoverT=C.infantry.reseekDelay*(.88+s.rng()*.28);
    e.assaultT=C.infantry.assaultRushDuration*(.92+s.rng()*.18);
    transition(e,'ADVANCE');
    e.suppression=Math.min(e.suppression,.34);
  }

  function updateAssaultPulse(s,dt){
    if(!s.artillery.finished)return;
    const covered=s.enemies.filter(e=>e.state!=='DEAD'&&isCraterCovered(e));
    if(!s.assault.armed&&covered.length){
      s.assault.armed=true;
      s.assault.t=C.infantry.coverWaveHold;
      s.assault.whistle=false;
    }
    if(!s.assault.armed)return;

    s.assault.t-=dt;
    if(!s.assault.whistle&&s.assault.t<=C.infantry.assaultSignalLead){
      s.assault.whistle=true;
      J.Audio.play('assaultWhistle',{x:s.viewport.w*.5,variation:s.rng()});
      s.ui.message='ASSAULT WHISTLE';
      s.ui.messageT=.9;
    }
    if(s.assault.t<=0){
      let released=0;
      for(const e of s.enemies){
        if(e.state!=='DEAD'&&isCraterCovered(e)){releaseFromCover(s,e);released++;}
      }
      s.assault.armed=false;
      s.assault.whistle=false;
      s.assault.pulse++;
      s.assault.lastReleased=released;
      if(released){
        s.ui.message='THEY ARE MOVING';
        s.ui.messageT=.72;
        s.trauma=Math.min(1,s.trauma+.035);
      }
    }
  }

  function updateOne(s,e,dt){
    e.stateT+=dt;e.anim+=dt;
    e.hitT=Math.max(0,e.hitT-dt);e.muzzleT=Math.max(0,e.muzzleT-dt);e.recoilT=Math.max(0,e.recoilT-dt);
    e.assaultT=Math.max(0,e.assaultT-dt);e.reCoverT=Math.max(0,e.reCoverT-dt);
    e.suppression=Math.max(0,e.suppression-C.infantry.suppressionDecay*dt);

    if(e.state==='DEAD'){
      e.deathT+=dt;
      e.alpha=e.deathT>C.infantry.corpseFadeStart?U.clamp(1-(e.deathT-C.infantry.corpseFadeStart)/(C.infantry.corpseLifetime-C.infantry.corpseFadeStart),0,1):1;
      return;
    }

    if(!e.cover&&e.reCoverT<=0&&e.state==='ADVANCE'&&!e.coverIntent&&e.assaultT<=0&&e.suppression>.34)e.coverIntent=true;

    if(e.state==='ADVANCE'&&(e.suppression>.30||(e.coverIntent&&e.y>72&&e.stateT>1.05))&&e.assaultT<=0){
      const c=findCover(s,e);
      if(c){e.cover=c;e.coverIntent=false;c.occupiedBy=e.id;transition(e,'SPRINT_TO_COVER');}
    }

    let tx=s.bunker.x,ty=s.bunker.y-28,spd=e.assaultT>0?C.infantry.assaultSprint:e.speed;

    if(e.state==='SPRINT_TO_COVER'&&e.cover){
      tx=e.cover.x;ty=e.cover.y;spd=C.infantry.sprint;
      if(Math.hypot(tx-e.x,ty-e.y)<7){transition(e,'ENTER_COVER');e.coverT=.20;}
    }

    if(e.state==='ENTER_COVER'){
      e.coverT-=dt;
      if(e.coverT<=0)transition(e,'FIRE_FROM_COVER');
      return;
    }

    if(e.state==='FIRE_FROM_COVER'){
      e.fireT-=dt;
      if(e.fireT<=0){enemyFire(s,e,true);e.fireT=C.infantry.fireInterval*(.82+Math.random()*.5)*(1+e.suppression*.8);}
      return;
    }

    if(e.state==='ADVANCE'||e.state==='SPRINT_TO_COVER'){
      const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
      e.vx=dx/d*spd;e.vy=dy/d*spd;e.x+=e.vx*dt;e.y+=e.vy*dt;e.angle=Math.atan2(e.vy,e.vx);
      if(e.state==='ADVANCE'&&d<C.infantry.range&&e.assaultT<=0){transition(e,'IN_COVER');e.fireT=.15+Math.random()*.5;}
    } else if(e.state==='IN_COVER'){
      e.fireT-=dt;
      if(e.fireT<=0){enemyFire(s,e,false);e.fireT=C.infantry.fireInterval*(.9+Math.random()*.45);}
    }
  }

  function enemyFire(s,e,covered){
    const dx=s.bunker.x-e.x,dy=s.bunker.y-e.y,d=Math.hypot(dx,dy);
    const movePenalty=e.state==='ADVANCE'?.08:0;
    const spread=.07+movePenalty+e.suppression*.12;
    const hitChance=U.clamp(.62-d/1000-spread,.12,.55);
    e.phase+=.7;e.muzzleT=.075;e.recoilT=.10;
    J.Audio.play('enemyRifle',{x:e.x,variation:Math.random()});
    J.Particles.emit(s,'muzzle',e.x,e.y-8,2,{angle:e.angle,arc:.18,speedMin:18,speedMax:42,life:.07,size:2.4});
    if(Math.random()<hitChance){
      s.bunker.hp=Math.max(0,s.bunker.hp-(covered?1.4:2.0));
      s.bunker.flash=.16;s.trauma=Math.min(1,s.trauma+.035);
      J.Audio.play('bunkerHit',{x:s.bunker.x,variation:Math.random()});
      J.Particles.emit(s,'spark',s.bunker.x+U.rnd(-28,28),s.bunker.y-24,4,{speedMin:35,speedMax:105,life:.18,size:1.2});
      if(s.bunker.hp<=0)s.mode='gameover';
    }
  }

  function damage(s,e,amount,kind,x,y){
    if(e.state==='DEAD')return false;
    let mult=1;
    if(isCraterCovered(e)){
      if(kind==='mg')mult=C.weapons.mg.coverDamage;
      if(kind==='ap')mult=C.weapons.ap.coverDamage;
      if(kind==='he')mult=C.weapons.he.coverDamage;
    }
    e.hp-=amount*mult;e.hitT=.14;e.suppression=Math.min(1,e.suppression+.25);
    J.Audio.play('cloth',{x:e.x});
    J.Particles.emit(s,'blood',x??e.x,y??e.y,kind==='he'?10:4,{speedMin:18,speedMax:95,life:.35,gravity:60,size:1.7});
    if(e.hp<=0){kill(s,e,kind);return true;}
    return false;
  }

  function kill(s,e,kind){
    e.state='DEAD';e.deathT=0;e.vx=e.vy=0;
    if(e.cover&&e.cover.occupiedBy===e.id)e.cover.occupiedBy=null;
    e.cover=null;s.stats.kills++;
    J.World.bloodMark(s,e.x,e.y,kind==='he'?2:1);
    J.Particles.emit(s,'blood',e.x,e.y,kind==='he'?15:7,{speedMin:25,speedMax:125,life:.55,gravity:90,size:2});
    if(kind==='he')J.Particles.emit(s,'debris',e.x,e.y,5,{speedMin:25,speedMax:95,life:.7,gravity:95,size:1.8});
    s.trauma=Math.min(1,s.trauma+(kind==='he'?.12:.025));
  }

  function update(s,dt){
    updateAssaultPulse(s,dt);
    for(const e of s.enemies)updateOne(s,e,dt);
    s.enemies=s.enemies.filter(e=>e.state!=='DEAD'||e.deathT<C.infantry.corpseLifetime);
  }

  J.Infantry={spawn,update,damage,findCover,isCraterCovered};
})();


/* ===== vehicles.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG,U=J.U;
  let nextId=10000;

  function typeCfg(type){return C.vehicles.types[type];}
  function isThreat(v){return v.state!=='DESTROYED'&&v.state!=='DEPARTED';}

  function spawn(s,type,lane=0){
    if(s.vehicles.filter(isThreat).length>=C.vehicles.maxActive)return null;
    const cfg=typeCfg(type),w=s.viewport.w;
    const x=U.clamp(w*.5+lane*w*.62,44,w-44);
    const v={
      id:nextId++,type,x,y:-48,spawnX:x,lane,hp:cfg.hp,maxHp:cfg.hp,radius:cfg.radius,
      speed:cfg.speed,state:'ADVANCE',stateT:0,hullAngle:Math.PI/2,turretAngle:Math.PI/2,
      trackPhase:0,wheelPhase:0,suspension:Math.random()*6.28,recoil:0,muzzle:0,fireT:.7+s.rng()*1.1,
      smokeT:0,motorT:0,damageStage:0,armorBroken:false,deadT:0,dropDone:false,dropT:0,
      dropY:s.viewport.h*C.vehicles.dropYRatio,passengers:cfg.passengers||0,passengersDropped:0,
      targetX:s.bunker.x,targetY:s.bunker.y-18,coverNode:null,flash:0,departing:false
    };
    s.vehicles.push(v);
    J.Audio.vehicleMotor(v.id,{x:v.x,speed:v.speed,type:v.type,active:true});
    s.ui.message=type==='tank'?'HEAVY ARMOR':type==='stug'?'ASSAULT GUN':type==='truck'?'TROOP TRUCK':'VEHICLE CONTACT';
    s.ui.messageT=.85;
    return v;
  }

  function updateWave(s,dt){
    if(!s.artillery.finished)return;
    if(!s.vehicleWave.started){s.vehicleWave.started=true;s.vehicleWave.t=0;s.vehicleWave.index=0;}
    s.vehicleWave.t+=dt;
    const q=C.vehicles.waveSchedule;
    while(s.vehicleWave.index<q.length&&s.vehicleWave.t>=q[s.vehicleWave.index].time){
      const item=q[s.vehicleWave.index++];spawn(s,item.type,item.lane);
    }
    s.vehicleWave.finished=s.vehicleWave.index>=q.length;
  }

  function laneTarget(s,v){
    const progress=U.clamp((v.y+50)/(s.bunker.y-60),0,1);
    const bend=Math.sin(progress*Math.PI*1.35+v.lane*5)*s.viewport.w*.055;
    const center=s.viewport.w*.5+v.lane*s.viewport.w*.42;
    return U.clamp(center+bend,38,s.viewport.w-38);
  }

  function aimAtBunker(s,v,dt){
    const desired=Math.atan2(s.bunker.y-v.y,s.bunker.x-v.x);
    if(v.type==='stug'){
      const rel=((desired-v.hullAngle+Math.PI*3)%(Math.PI*2))-Math.PI;
      const clamped=v.hullAngle+U.clamp(rel,-.22,.22);
      v.turretAngle=U.angleLerp(v.turretAngle,clamped,Math.min(1,dt*3.3));
    }else v.turretAngle=U.angleLerp(v.turretAngle,desired,Math.min(1,dt*(v.type==='tank'?2.3:4.5)));
  }

  function fire(s,v){
    const cfg=typeCfg(v.type);if(!cfg.range)return;
    const dx=s.bunker.x-v.x,dy=s.bunker.y-v.y,d=Math.hypot(dx,dy);
    if(d>cfg.range)return;
    const heavy=v.type==='tank'||v.type==='stug';
    v.recoil=heavy?11:5;v.muzzle=heavy?.12:.07;
    const spread=heavy?.025:.07,ang=v.turretAngle+U.gaussian()*spread;
    const sx=v.x+Math.cos(ang)*(heavy?31:24),sy=v.y+Math.sin(ang)*(heavy?31:24);
    s.vehicleShots.push({x:sx,y:sy,px:sx,py:sy,ang,kind:heavy?'shell':'mg',speed:heavy?430:680,life:1.5,owner:v.id,damage:cfg.damage});
    J.Audio.play(heavy?'tankGun':'vehicleMg',{x:v.x,variation:Math.random()});
    J.Particles.emit(s,'muzzle',sx,sy,heavy?6:3,{angle:ang,arc:.22,speedMin:32,speedMax:130,life:.11,size:heavy?3.8:2.2});
    J.Particles.emit(s,'smoke',sx,sy,heavy?3:1,{angle:ang+Math.PI,arc:.7,speedMin:7,speedMax:26,life:.6,size:4});
  }

  function deployTroops(s,v,count){
    if(count<=0)return;
    for(let i=0;i<count;i++){
      const side=(i-(count-1)/2)*15;
      const e=J.Infantry.spawn(s,U.clamp(v.x+side,22,s.viewport.w-22),v.y+10+i*3,{coverIntent:true,reCoverT:.3});
      e.assaultT=.55+i*.08;e.stateT=0;e.suppression=.12;
    }
    v.passengersDropped+=count;
    J.Audio.play('troopDrop',{x:v.x,variation:Math.random()});
    s.ui.message='TROOPS DEPLOYING';s.ui.messageT=.7;
  }

  function updateDrop(s,v,dt){
    if(v.dropDone||!v.passengers)return false;
    if(v.y<v.dropY)return false;
    if(v.state!=='DROPPING'){v.state='DROPPING';v.stateT=0;v.dropT=.68;return true;}
    v.dropT-=dt;
    if(v.dropT<=0){deployTroops(s,v,v.passengers);v.passengers=0;v.dropDone=true;v.state='ADVANCE';v.departing=v.type==='truck';v.stateT=0;}
    return true;
  }

  function updateOne(s,v,dt){
    v.stateT+=dt;v.recoil=Math.max(0,v.recoil-dt*45);v.muzzle=Math.max(0,v.muzzle-dt);v.flash=Math.max(0,v.flash-dt);
    if(v.state==='DESTROYED'){
      v.deadT+=dt;v.smokeT-=dt;
      if(v.smokeT<=0){v.smokeT=.18+Math.random()*.16;J.Particles.emit(s,'smoke',v.x+U.rnd(-8,8),v.y+U.rnd(-5,5),1,{speedMin:4,speedMax:18,life:1.45,size:6,vy:-18});if(v.deadT<7&&Math.random()<.35)J.Particles.emit(s,'fire',v.x,v.y,1,{speedMin:5,speedMax:18,life:.38,size:3.3,vy:-10});}
      J.Audio.vehicleMotor(v.id,{x:v.x,speed:0,type:v.type,active:false});return;
    }
    if(v.state==='DEPARTED'){J.Audio.vehicleMotor(v.id,{x:v.x,speed:0,type:v.type,active:false});return;}

    if(updateDrop(s,v,dt)){J.Audio.vehicleMotor(v.id,{x:v.x,speed:4,type:v.type,active:true});return;}

    const cfg=typeCfg(v.type),targetX=v.departing?v.spawnX:laneTarget(s,v),targetY=v.departing?s.viewport.h+C.vehicles.exitPadding:s.bunker.y-80;
    const dx=targetX-v.x,dy=targetY-v.y,d=Math.hypot(dx,dy)||1;
    const moveSpeed=v.departing?cfg.speed*1.05:cfg.speed;
    const canStop=(v.type==='tank'||v.type==='stug'||v.type==='halftrack'||v.type==='technical');
    const bunkerDist=Math.hypot(s.bunker.x-v.x,s.bunker.y-v.y);
    const stopForFire=canStop&&cfg.range&&bunkerDist<cfg.range*.86;
    const actualSpeed=stopForFire?moveSpeed*.18:moveSpeed;
    v.x+=dx/d*actualSpeed*dt;v.y+=dy/d*actualSpeed*dt;
    const desiredHull=Math.atan2(dy,dx);v.hullAngle=U.angleLerp(v.hullAngle,desiredHull,Math.min(1,dt*2.6));
    v.trackPhase+=actualSpeed*dt*.11;v.wheelPhase+=actualSpeed*dt*.065;
    aimAtBunker(s,v,dt);

    if(v.departing&&v.y>s.viewport.h+C.vehicles.exitPadding*.65){v.state='DEPARTED';J.Audio.vehicleMotor(v.id,{x:v.x,speed:0,type:v.type,active:false});return;}

    v.fireT-=dt;
    if(cfg.range&&v.fireT<=0&&bunkerDist<cfg.range){fire(s,v);v.fireT=cfg.fireInterval*(.82+s.rng()*.38);}
    J.Audio.vehicleMotor(v.id,{x:v.x,speed:actualSpeed,type:v.type,active:true});

    const hpRatio=v.hp/v.maxHp;
    v.damageStage=hpRatio>.65?0:hpRatio>.35?1:2;
    if(v.damageStage>0){v.smokeT-=dt;if(v.smokeT<=0){v.smokeT=v.damageStage===2?.12:.27;J.Particles.emit(s,'smoke',v.x+U.rnd(-7,7),v.y+U.rnd(-7,7),1,{speedMin:3,speedMax:16,life:v.damageStage===2?1.3:.9,size:v.damageStage===2?6:4.5,vy:-16});if(v.damageStage===2&&Math.random()<.22)J.Particles.emit(s,'spark',v.x,v.y,1,{speedMin:20,speedMax:55,life:.16,size:1});}}
  }

  function segmentCircle(b,v){
    const ax=b.px,ay=b.py,bx=b.x,by=b.y,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
    const t=U.clamp(((v.x-ax)*dx+(v.y-ay)*dy)/l2,0,1),px=ax+dx*t,py=ay+dy*t;
    return Math.hypot(v.x-px,v.y-py)<=v.radius;
  }

  function hitProjectile(s,b){
    let best=null,bestDist=1e9;
    for(const v of s.vehicles){if(!isThreat(v))continue;if(!segmentCircle(b,v))continue;const d=Math.hypot(v.x-b.px,v.y-b.py);if(d<bestDist){best=v;bestDist=d;}}
    if(!best)return false;
    if(b.kind==='he')return {vehicle:best,detonate:true};
    damage(s,best,C.weapons[b.kind].damage,b.kind,b.x,b.y);
    b.active=false;return {vehicle:best,detonate:false};
  }

  function blastDamage(s,x,y,radius,baseDamage){
    for(const v of s.vehicles){if(!isThreat(v))continue;const d=Math.hypot(v.x-x,v.y-y);if(d>radius+v.radius*.5)continue;const fall=U.clamp(1-d/(radius+v.radius*.5),0,1);damage(s,v,baseDamage*(.28+.72*fall),'he',v.x,v.y);}
  }

  function damage(s,v,amount,kind,x,y){
    if(!isThreat(v))return false;const cfg=typeCfg(v.type),mult=cfg.armor[kind]??1,prev=v.hp/v.maxHp;
    const final=amount*mult;v.hp-=final;v.flash=.10;s.stats.armorHits++;
    if(mult<.12&&kind==='mg'){
      J.Audio.play('ricochet',{x:v.x,variation:Math.random()});J.Particles.emit(s,'spark',x??v.x,y??v.y,4,{speedMin:45,speedMax:120,life:.22,size:1.2});
    }else{
      J.Audio.play('armorImpact',{x:v.x,variation:Math.random()});J.Particles.emit(s,'spark',x??v.x,y??v.y,kind==='ap'?7:4,{speedMin:35,speedMax:135,life:.24,size:1.35});
    }
    const now=v.hp/v.maxHp;
    if(prev>.35&&now<=.35&&!v.armorBroken){v.armorBroken=true;J.Audio.play('armorBreak',{x:v.x,variation:Math.random()});s.ui.message='ARMOR BREAK';s.ui.messageT=.65;J.Particles.emit(s,'debris',v.x,v.y,6,{speedMin:35,speedMax:105,life:.55,gravity:80,size:1.8});}
    if(v.hp<=0){destroy(s,v,kind);return true;}
    return false;
  }

  function destroy(s,v,kind){
    if(v.state==='DESTROYED')return;v.state='DESTROYED';v.deadT=0;v.hp=0;v.recoil=0;s.stats.vehicleKills++;
    J.Audio.vehicleMotor(v.id,{x:v.x,speed:0,type:v.type,active:false});
    J.Audio.play(v.type==='tank'||v.type==='stug'?'vehicleExplosion':'explosion',{x:v.x,variation:Math.random()});
    const heavy=v.type==='tank'||v.type==='stug';s.explosions.push({x:v.x,y:v.y,t:0,dur:heavy?1.05:.82,radius:heavy?88:66,seed:U.hash(v.id*31),big:heavy});
    s.trauma=Math.min(1,s.trauma+(heavy?.42:.26));J.World.scorchMark(s,v.x,v.y,heavy?32:23,1.45);
    J.Particles.emit(s,'debris',v.x,v.y,heavy?14:9,{speedMin:45,speedMax:190,life:1.0,gravity:145,size:2.4});
    J.Particles.emit(s,'smoke',v.x,v.y,heavy?14:9,{speedMin:12,speedMax:65,life:1.65,size:8,vy:-23});
    J.Particles.emit(s,'fire',v.x,v.y,heavy?10:6,{speedMin:10,speedMax:75,life:.65,size:4});
    if(v.passengers>0&&!v.dropDone){const survivors=Math.min(v.passengers,1+(s.rng()<.55?1:0));deployTroops(s,v,survivors);v.passengers=0;}
    const cfg=typeCfg(v.type);v.coverNode={id:s.cover.length+1,x:v.x,y:v.y,radius:v.radius*.88,coverStrength:cfg.cover,occupiedBy:null,danger:.5,age:0,wreck:true,vehicleId:v.id};s.cover.push(v.coverNode);
    s.ui.message=heavy?'VEHICLE DESTROYED':'VEHICLE KILL';s.ui.messageT=.8;
  }

  function updateShots(s,dt){
    for(const q of s.vehicleShots){q.life-=dt;q.px=q.x;q.py=q.y;q.x+=Math.cos(q.ang)*q.speed*dt;q.y+=Math.sin(q.ang)*q.speed*dt;
      if(Math.hypot(q.x-s.bunker.x,q.y-s.bunker.y)<34||q.y>s.viewport.h+20||q.life<=0){
        q.life=0;if(Math.hypot(q.x-s.bunker.x,q.y-s.bunker.y)<55){s.bunker.hp=Math.max(0,s.bunker.hp-q.damage);s.bunker.flash=q.kind==='shell'?.28:.12;s.trauma=Math.min(1,s.trauma+(q.kind==='shell'?.16:.025));J.Audio.play(q.kind==='shell'?'bunkerShellHit':'bunkerHit',{x:s.bunker.x,variation:Math.random()});J.Particles.emit(s,q.kind==='shell'?'debris':'spark',s.bunker.x+U.rnd(-24,24),s.bunker.y-22,q.kind==='shell'?9:3,{speedMin:35,speedMax:130,life:.4,gravity:q.kind==='shell'?70:0,size:1.5});if(s.bunker.hp<=0)s.mode='gameover';}}
    }
    s.vehicleShots=s.vehicleShots.filter(q=>q.life>0);
  }

  function update(s,dt){updateWave(s,dt);for(const v of s.vehicles)updateOne(s,v,dt);updateShots(s,dt);}
  function allResolved(s){return s.vehicleWave.finished&&s.vehicles.every(v=>v.state==='DESTROYED'||v.state==='DEPARTED');}

  J.Vehicles={spawn,update,damage,hitProjectile,blastDamage,isThreat,allResolved,typeCfg};
})();


/* ===== combat.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG,U=J.U;

  function init(s){s.bullets=Array.from({length:C.render.bullets},()=>({active:false}));s.pendingShots=[];s.explosions=[];s.fires=[];}
  function allocBullet(s){for(const b of s.bullets)if(!b.active)return b;return null;}

  function fireCharge(s,hold,x,y){
    if(s.mode!=='playing')return;
    const b=s.bunker,dx=x-b.x,dy=y-(b.y-7),base=Math.atan2(dy,dx);b.aim=base;
    if(hold<C.input.apCharge){
      for(let i=0;i<C.weapons.mg.burst;i++)s.pendingShots.push({t:i*C.weapons.mg.cadence,kind:'mg',a:base,x,y,index:i});
    }else if(hold<C.input.heCharge)spawnProjectile(s,'ap',base,x,y,0);
    else spawnProjectile(s,'he',base,x,y,0);
  }

  function spawnProjectile(s,kind,base,targetX,targetY,index=0){
    const b=allocBullet(s);if(!b)return;const W=C.weapons[kind];
    const spread=U.gaussian()*W.spread*(kind==='mg'?(1+index*.16):1),a=base+spread;
    const sx=s.bunker.x+Math.cos(a)*38,sy=s.bunker.y-8+Math.sin(a)*38;
    const targetDist=Math.max(24,Math.hypot(targetX-sx,targetY-sy));
    Object.assign(b,{active:true,kind,x:sx,y:sy,px:sx,py:sy,vx:Math.cos(a)*W.speed,vy:Math.sin(a)*W.speed,life:kind==='he'?1.8:1.2,targetX,targetY,travel:0,maxTravel:targetDist*(kind==='he'?1.03:1.08)});
    s.bunker.recoil=kind==='mg'?5:kind==='ap'?10:13;s.bunker.muzzle=kind==='mg'?.07:kind==='ap'?.10:.12;s.bunker.muzzleKind=kind;s.stats.shots++;
    J.Audio.play(kind==='mg'?'mg':kind==='ap'?'ap':'heLaunch',{x:s.bunker.x,variation:Math.random()});
    J.Particles.emit(s,'muzzle',sx,sy,kind==='mg'?3:5,{angle:a,arc:.22,speedMin:35,speedMax:125,life:.10,size:kind==='mg'?2.1:3.3});
    J.Particles.emit(s,'smoke',sx,sy,kind==='mg'?1:2,{angle:a+Math.PI,arc:.6,speedMin:8,speedMax:28,life:.42,size:3.5});
  }

  function updatePending(s,dt){
    for(let i=s.pendingShots.length-1;i>=0;i--){const q=s.pendingShots[i];q.t-=dt;if(q.t<=0){spawnProjectile(s,'mg',q.a,q.x,q.y,q.index);s.pendingShots.splice(i,1);}}
  }

  function nearMissSuppression(s,b){
    if(b.kind!=='mg')return;
    for(const e of s.enemies){if(e.state==='DEAD')continue;const dx=e.x-b.x,dy=e.y-b.y,d2=dx*dx+dy*dy;if(d2<32*32)e.suppression=Math.min(1,e.suppression+.045);}
  }

  function hitBullet(s,b){

    }
    if(best){
      const dmg=C.weapons[b.kind].damage;J.Infantry.damage(s,best,dmg,b.kind,b.x,b.y);s.stats.hits++;b.active=false;
      if(b.kind==='ap')J.Particles.emit(s,'spark',b.x,b.y,4,{speedMin:35,speedMax:120,life:.18,size:1.2});

  }

    J.Particles.emit(s,heavy?'spark':'dirt',b.x,b.y,heavy?5:4,{speedMin:18,speedMax:75,life:.30,gravity:80,size:heavy?1.3:1.7});
    if(heavy)J.Particles.emit(s,'dirt',b.x,b.y,4,{speedMin:15,speedMax:58,life:.28,gravity:95,size:1.5});
  }

  function explode(s,x,y,radius,source='he',big=false){
    const seed=U.hash((x*13+y*17+s.simTime*1000)|0);
    s.explosions.push({x,y,t:0,dur:big?1.0:.72,radius,seed,big});
    J.Audio.play(big?'artillery':'explosion',{x,variation:Math.random()});s.trauma=Math.min(1,s.trauma+(big?.34:.22));
    J.Particles.emit(s,'dirt',x,y,big?34:23,{speedMin:45,speedMax:205,life:.72,gravity:150,size:2.5});
    J.Particles.emit(s,'debris',x,y,big?10:6,{speedMin:45,speedMax:160,life:.85,gravity:135,size:2.0});
    J.Particles.emit(s,'smoke',x,y,big?15:10,{speedMin:15,speedMax:66,life:1.65,size:8,vy:-24});
    J.Particles.emit(s,'fire',x,y,big?10:7,{speedMin:15,speedMax:92,life:.50,gravity:-12,size:3.8});
    J.Particles.emit(s,'ember',x,y,big?9:5,{speedMin:35,speedMax:125,life:.7,gravity:45,size:1.2});

  }

  }

  function artilleryStart(s){
    s.artillery.started=true;s.artillery.t=0;s.artillery.index=0;s.artillery.next=C.artillery.introDelay;const r=s.rng;s.artillery.events=[];

      const margin=26,x=margin+r()*(s.viewport.w-margin*2),y=58+r()*(s.bunker.y-155);
      const time=C.artillery.introDelay+(i/(C.artillery.count-1))*C.artillery.duration+(r()-.5)*.12;
      s.artillery.events.push({x,y,time,whistle:false,done:false});
    }
  }

  function updateArtillery(s,dt){
    if(!s.artillery.started)artilleryStart(s);s.artillery.t+=dt;
    for(const ev of s.artillery.events){
      if(!ev.whistle&&s.artillery.t>ev.time-.48){ev.whistle=true;J.Audio.play('whistle',{x:ev.x,variation:Math.random()});}
      if(!ev.done&&s.artillery.t>=ev.time){ev.done=true;explode(s,ev.x,ev.y,U.rnd(76,96,s.rng),'artillery',true);}
    }
    if(!s.artillery.finished&&s.artillery.events.every(e=>e.done)){s.artillery.finished=true;s.ui.message='CONTACT FRONT';s.ui.messageT=1.15;}
  }

  function update(s,dt){
    s.bunker.recoil=Math.max(0,s.bunker.recoil-dt*42);s.bunker.flash=Math.max(0,s.bunker.flash-dt);s.bunker.muzzle=Math.max(0,(s.bunker.muzzle||0)-dt);
    updatePending(s,dt);updateBullets(s,dt);updateExplosions(s,dt);J.Particles.update(s,dt);
  }

  J.Combat={init,fireCharge,explode,update,updateArtillery};
})();


/* ===== input.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG;
  function init(s,canvas){
    canvas.style.touchAction='none';canvas.addEventListener('contextmenu',e=>e.preventDefault());
    const pos=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left),y:(e.clientY-r.top)}};
    canvas.addEventListener('pointerdown',e=>{if(s.mode!=='playing')return;e.preventDefault();J.Audio.unlock(s);const p=pos(e);s.input.down=true;s.input.x=p.x;s.input.y=p.y;s.input.downAt=s.simTime;s.input.charge=0;s.input.pointerId=e.pointerId;try{canvas.setPointerCapture(e.pointerId)}catch(_){} });
    canvas.addEventListener('pointermove',e=>{if(!s.input.down||e.pointerId!==s.input.pointerId)return;const p=pos(e);s.input.x=p.x;s.input.y=p.y;});
    const up=e=>{if(!s.input.down||e.pointerId!==s.input.pointerId)return;e.preventDefault();const p=pos(e);s.input.x=p.x;s.input.y=p.y;const hold=Math.max(0,s.simTime-s.input.downAt);s.input.down=false;s.input.pointerId=null;J.Combat.fireCharge(s,hold,p.x,p.y);};
    canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',e=>{s.input.down=false;s.input.pointerId=null;});
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  }
  function update(s,dt){if(s.input.down){s.input.charge=Math.min(C.input.maxCharge,s.simTime-s.input.downAt);const dx=s.input.x-s.bunker.x,dy=s.input.y-(s.bunker.y-7);s.bunker.aim=Math.atan2(dy,dx);}else s.input.charge=Math.max(0,s.input.charge-dt*4);}
  J.Input={init,update};
})();

  J.Render={render};
})();


/* ===== main.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG,U=J.U;
  let s,canvas,ctx,deploy,overlay,title,sub,restart;
  function setup(){
    canvas=document.getElementById('game');ctx=canvas.getContext('2d',{alpha:false});deploy=document.getElementById('deploy');overlay=document.getElementById('overlay');title=document.getElementById('title');sub=document.getElementById('sub');restart=document.getElementById('restart');
    s=J.makeState();J.SpriteSystem.init();J.Particles.init(s);J.Combat.init(s);J.World.resize(s,canvas);J.Input.init(s,canvas);window.__JBD_STATE__=s;
    const onResize=()=>J.World.resize(s,canvas);window.addEventListener('resize',onResize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(onResize,120),{passive:true});
    deploy.addEventListener('click',()=>{J.Audio.unlock(s);s.mode='playing';s.deployed=true;overlay.classList.add('hidden');s.ui.message='DEPLOY';s.ui.messageT=.8;if(C.stress){for(let i=0;i<25;i++)J.Infantry.spawn(s);for(const [i,t] of ['technical','truck','halftrack','stug','tank'].entries())J.Vehicles.spawn(s,t,(i-2)*.12);s.vehicleWave.started=true;s.vehicleWave.index=C.vehicles.waveSchedule.length;s.vehicleWave.finished=true;s.spawn.count=C.level.spawnCount;J.Particles.emit(s,'dirt',s.viewport.w*.5,s.viewport.h*.42,220,{speedMin:20,speedMax:180,life:1.2,gravity:90,size:2});J.Particles.emit(s,'smoke',s.viewport.w*.5,s.viewport.h*.38,80,{speedMin:10,speedMax:90,life:1.8,size:7,vy:-18});}});
    restart.addEventListener('click',()=>location.reload());requestAnimationFrame(loop);
  }
  function update(dt){s.simTime+=dt;s.trauma=Math.max(0,s.trauma-dt*.8);s.ui.messageT=Math.max(0,s.ui.messageT-dt);J.Input.update(s,dt);
    if(s.mode==='playing'){
      J.Combat.updateArtillery(s,dt);
      if(s.artillery.t>C.artillery.introDelay+C.artillery.duration*.72&&s.spawn.count<C.level.spawnCount){s.spawn.t-=dt;if(s.spawn.t<=0){J.Infantry.spawn(s);s.spawn.count++;s.spawn.t=C.level.spawnDuration/C.level.spawnCount*(.68+s.rng()*.48);}}
      J.Infantry.update(s,dt);J.Vehicles.update(s,dt);J.Combat.update(s,dt);
      const infantryDone=s.spawn.count>=C.level.spawnCount&&s.enemies.every(e=>e.state==='DEAD');
      if(infantryDone&&J.Vehicles.allResolved(s)){s.completeT+=dt;if(s.completeT>C.level.completeDelay&&!s.levelComplete){s.levelComplete=true;s.mode='complete';showComplete();}}else s.completeT=0;
    } else if(s.mode==='gameover'){J.Infantry.update(s,dt);J.Vehicles.update(s,dt);J.Combat.update(s,dt);showGameOver();}
  }
  function showComplete(){title.textContent='ARMOR TRIAL SECURE';sub.innerHTML=`Milestone 6 cleared · ${s.stats.kills} infantry · ${s.stats.vehicleKills} vehicles<br><span>Technicals, troop trucks, halftracks, StuG/tank, damage states en wreck-cover actief.</span>`;deploy.style.display='none';restart.style.display='inline-flex';restart.textContent='PLAY AGAIN';overlay.classList.remove('hidden');}
  function showGameOver(){if(!overlay.classList.contains('hidden'))return;title.textContent='BUNKER OVERRUN';sub.textContent='De linie is gebroken.';deploy.style.display='none';restart.style.display='inline-flex';restart.textContent='REDEPLOY';overlay.classList.remove('hidden');}
  function loop(ts){if(!s.lastTs)s.lastTs=ts;let frame=Math.min(C.maxFrameDelta,(ts-s.lastTs)/1000);s.lastTs=ts;s.accumulator+=frame;const inst=1/Math.max(.001,frame);s.fpsSmoothed=U.lerp(s.fpsSmoothed,inst,.05);s.quality=s.fpsSmoothed<48?Math.max(.55,s.quality-.005):Math.min(1,s.quality+.002);let steps=0;while(s.accumulator>=C.step&&steps<6){update(C.step);s.accumulator-=C.step;steps++;}J.Render.render(s,ctx);requestAnimationFrame(loop);}
  window.addEventListener('DOMContentLoaded',setup);
})();

</script></body></html>
