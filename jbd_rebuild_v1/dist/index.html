(() => {
  const J = window.JBD;
  J.U = {
    clamp: (v,a,b)=>Math.max(a,Math.min(b,v)),
    lerp: (a,b,t)=>a+(b-a)*t,
    dist2: (a,b)=>{const x=a.x-b.x,y=a.y-b.y;return x*x+y*y;},
    len: (x,y)=>Math.hypot(x,y),
    norm(x,y){const l=Math.hypot(x,y)||1; return {x:x/l,y:y/l};},
    angleLerp(a,b,t){ let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*t; },
    hash(n){ n=(n^61)^(n>>>16); n=n+ (n<<3); n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15); return n>>>0; },
    mulberry32(seed){ return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;} },
    gaussian(rng=Math.random){let u=0,v=0; while(!u)u=rng(); while(!v)v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);},
    rnd(a,b,r=Math.random){return a+(b-a)*r();}
  };
})();

/* ===== sprites.js ===== */
(() => {
  const J=window.JBD;
  const S={soldier:[],crouch:null,dead:null,bunker:null};
  function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
  function soldierFrame(phase=0,crouch=false){
    const c=canvas(44,52),g=c.getContext('2d'); g.translate(22,26); g.lineCap='round';g.lineJoin='round';
    const bob=crouch?2:Math.sin(phase)*1.1, swing=crouch?0:Math.sin(phase)*5.0;
    g.save();g.translate(3,7);g.rotate(-.35);g.scale(1,.6);g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,0,10,5,0,0,6.28);g.fill();g.restore();

    const legY=crouch?7:9;
    g.beginPath();g.moveTo(-3,5+bob);g.lineTo(-5+swing*.45,legY+7);g.stroke();
    g.beginPath();g.moveTo(3,5+bob);g.lineTo(5-swing*.45,legY+7);g.stroke();
    g.strokeStyle='#171915';g.lineWidth=5.2;
    g.beginPath();g.moveTo(-5+swing*.45,legY+7);g.lineTo(-6+swing*.5,legY+10);g.stroke();
    g.beginPath();g.moveTo(5-swing*.45,legY+7);g.lineTo(6-swing*.5,legY+10);g.stroke();
    // backpack
    g.fillStyle='#4a5133';g.strokeStyle='#1f241a';g.lineWidth=1.5;g.beginPath();g.roundRect(-7,-2+bob,14,13,4);g.fill();g.stroke();
    // torso

    // belt/gear
    g.fillStyle='#3a402a';g.fillRect(-7,3+bob,14,3);g.fillStyle='#7d744e';g.fillRect(-8,-1+bob,3,4);g.fillRect(5,-1+bob,3,4);
    // helmet + face at forward (-Y)
    g.fillStyle='#b28f69';g.strokeStyle='#332b22';g.lineWidth=1.2;g.beginPath();g.arc(0,-10+bob,4.7,0,6.28);g.fill();g.stroke();
    g.fillStyle='#4b5632';g.strokeStyle='#202619';g.beginPath();g.ellipse(0,-12+bob,6.4,4.3,0,Math.PI,Math.PI*2);g.lineTo(5,-10+bob);g.quadraticCurveTo(0,-8,-5,-10+bob);g.closePath();g.fill();g.stroke();

    g.beginPath();g.moveTo(4,-4+bob);g.lineTo(7-swing*.14,-8+bob);g.lineTo(3,-12+bob);g.stroke();
    g.strokeStyle='#171916';g.lineWidth=2.6;g.beginPath();g.moveTo(-2,-9+bob);g.lineTo(4,-19+bob);g.stroke();
    g.fillStyle='#704b2e';g.save();g.translate(1,-13+bob);g.rotate(.58);g.fillRect(-1.3,-7,2.6,9);g.restore();
    // tiny highlight
    g.strokeStyle='rgba(255,255,220,.35)';g.lineWidth=.8;g.beginPath();g.moveTo(-3,-6+bob);g.lineTo(2,-7+bob);g.stroke();
    return c;
  }
  function deadSprite(){ const c=canvas(54,36),g=c.getContext('2d');g.translate(27,18);g.rotate(-.28);g.fillStyle='rgba(0,0,0,.24)';g.beginPath();g.ellipse(3,6,16,5,0,0,6.28);g.fill();g.strokeStyle='#20251a';g.lineWidth=4;g.beginPath();g.moveTo(-6,1);g.lineTo(-16,7);g.moveTo(5,1);g.lineTo(16,5);g.stroke();g.fillStyle='#5c663d';g.strokeStyle='#22271a';g.lineWidth=1.3;g.beginPath();g.roundRect(-9,-6,18,12,4);g.fill();g.stroke();g.fillStyle='#b28f69';g.beginPath();g.arc(-11,-6,4.5,0,6.28);g.fill();g.fillStyle='#4b5632';g.beginPath();g.ellipse(-11,-8,6,3.5,0,Math.PI,Math.PI*2);g.fill();g.strokeStyle='#171916';g.lineWidth=2.2;g.beginPath();g.moveTo(3,-5);g.lineTo(18,-11);g.stroke();return c; }
  function bunkerBase(){ const c=canvas(150,96),g=c.getContext('2d');g.translate(75,56);g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,18,64,16,0,0,6.28);g.fill();

    g.fillStyle='#454b46';g.beginPath();g.ellipse(0,-5,20,11,0,0,6.28);g.fill();g.stroke();
    g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.moveTo(-32,-13);g.quadraticCurveTo(0,-24,29,-13);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;g.stroke();
    return c; }
  function init(){ S.soldier=[]; for(let i=0;i<8;i++)S.soldier.push(soldierFrame(i/8*Math.PI*2,false)); S.crouch=soldierFrame(0,true); S.dead=deadSprite(); S.bunker=bunkerBase(); J.Sprites=S; }
  J.SpriteSystem={init};
})();


/* ===== particles.js ===== */
(() => {
  const J=window.JBD, C=J.CONFIG;
  function init(s){ s.particles = Array.from({length:C.render.particles},()=>({active:false})); s.particleCursor=0; }
  function emit(s,type,x,y,count,opts={}){
    const q=s.quality; count=Math.max(1,Math.floor(count*q));
    for(let i=0;i<count;i++){
      let p=null;
      for(let tries=0;tries<s.particles.length;tries++){
        const idx=(s.particleCursor++)%s.particles.length;
        if(!s.particles[idx].active){p=s.particles[idx];break;}
      }
      if(!p) return;
      const a=(opts.angle??Math.random()*Math.PI*2)+(Math.random()-.5)*(opts.arc??Math.PI*2);
      const sp=J.U.rnd(opts.speedMin??18,opts.speedMax??95);
      Object.assign(p,{active:true,type,x,y,vx:Math.cos(a)*sp+(opts.vx||0),vy:Math.sin(a)*sp+(opts.vy||0),life:opts.life??J.U.rnd(.25,.8),maxLife:0,size:opts.size??J.U.rnd(1.5,4),rot:Math.random()*6.28,vr:(Math.random()-.5)*7,gravity:opts.gravity??0,alpha:opts.alpha??1});
      p.maxLife=p.life;
    }
  }
  function update(s,dt){
    for(const p of s.particles){ if(!p.active) continue; p.life-=dt; if(p.life<=0){p.active=false;continue;} p.vy+=p.gravity*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; if(p.type==='smoke'){p.vx*=.985;p.vy-=5*dt;p.size+=7*dt;} }
  }
  function render(s,ctx){
    for(const p of s.particles){ if(!p.active) continue; const t=p.life/p.maxLife; ctx.globalAlpha=Math.min(1,t*1.7)*p.alpha;
      switch(p.type){
        case 'spark': ctx.fillStyle='#ffd176'; ctx.fillRect(p.x,p.y,p.size*2,.9); break;
        case 'dirt': ctx.fillStyle=t>.5?'#6f5631':'#3f3425'; ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill(); break;
        case 'blood': ctx.fillStyle='#6c1612'; ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill(); break;
        case 'smoke': ctx.fillStyle='rgba(46,48,40,.75)'; ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill(); break;
        case 'fire': ctx.fillStyle=t>.5?'#ffd55f':'#e56f25'; ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill(); break;
      }
    }
    ctx.globalAlpha=1;
  }
  J.Particles={init,emit,update,render};
})();


/* ===== audio.js ===== */
(() => {
  const J=window.JBD, C=J.CONFIG;
  const A={ctx:null,master:null,buses:{},noise:null,ambience:null};
  function unlock(s){
    try{
      if(!A.ctx){
        const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
        const ctx=A.ctx=new AC(); const master=ctx.createGain(); master.gain.value=C.audio.master;
        const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-8; comp.knee.value=7; comp.ratio.value=8; comp.attack.value=.003; comp.release.value=.18;
        master.connect(comp).connect(ctx.destination); A.master=master;
        for(const k of ['weapons','explosions','ambience','ui']){const g=ctx.createGain();g.gain.value=k==='ambience'?.13:1;g.connect(master);A.buses[k]=g;}
        const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; A.noise=b;
        startAmbience();
      }
      A.ctx.resume(); s.audioReady=true;
    }catch(e){ s.audioReady=false; }
  }
  function panNode(x){const p=A.ctx.createStereoPanner?A.ctx.createStereoPanner():A.ctx.createGain(); if(p.pan)p.pan.value=J.U.clamp((x/(innerWidth||390))*2-1,-1,1); return p;}
  function envGain(t0,attack,hold,release,vol){const g=A.ctx.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t0+attack);g.gain.setValueAtTime(Math.max(.001,vol),t0+attack+hold);g.gain.exponentialRampToValueAtTime(.0001,t0+attack+hold+release);return g;}
  function osc(type,f0,f1,dur,vol,bus,x){if(!A.ctx)return; const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=envGain(t,.002,dur*.35,dur*.65,vol),p=panNode(x);o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);o.connect(g).connect(p).connect(A.buses[bus]);o.start(t);o.stop(t+dur+.03);}
  function noise(dur,vol,lp,bus,x,attack=.001){if(!A.ctx)return; const t=A.ctx.currentTime,src=A.ctx.createBufferSource(),f=A.ctx.createBiquadFilter(),g=envGain(t,attack,dur*.12,dur*.88,vol),p=panNode(x);src.buffer=A.noise;f.type='lowpass';f.frequency.value=lp;src.connect(f).connect(g).connect(p).connect(A.buses[bus]);src.start(t,Math.random());src.stop(t+dur+.05);}
  function play(name,{x=innerWidth/2,variation=Math.random()}={}){ if(!A.ctx||A.ctx.state==='suspended') return; const r=.96+variation*.08;
    if(name==='mg'){noise(.055,.24,4200,'weapons',x);osc('square',115*r,80,.06,.07,'weapons',x);osc('triangle',1100*r,650,.025,.035,'weapons',x);}
    else if(name==='ap'){noise(.095,.38,5200,'weapons',x);osc('triangle',150*r,65,.16,.19,'weapons',x);osc('square',1700*r,900,.035,.045,'weapons',x);}
    else if(name==='heLaunch'){noise(.13,.34,2200,'weapons',x);osc('sine',96*r,48,.22,.28,'weapons',x);}
    else if(name==='explosion'){noise(.52,.45,1500,'explosions',x,.002);osc('sine',78*r,38,.48,.34,'explosions',x);noise(.9,.16,600,'explosions',x,.01);}
    else if(name==='artillery'){noise(.72,.62,1350,'explosions',x,.002);osc('triangle',68*r,31,.62,.42,'explosions',x);noise(1.15,.15,500,'explosions',x,.015);}
    else if(name==='whistle'){osc('sine',1850*r,420,.62,.08,'explosions',x);}
    else if(name==='hit'){noise(.045,.12,2100,'weapons',x);}
    else if(name==='cloth'){noise(.07,.08,950,'weapons',x);}
  }
  function startAmbience(){ if(!A.ctx||A.ambience)return; const src=A.ctx.createBufferSource(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();src.buffer=A.noise;src.loop=true;f.type='bandpass';f.frequency.value=620;f.Q.value=.35;g.gain.value=.028;src.connect(f).connect(g).connect(A.buses.ambience);src.start();A.ambience=src; }
  J.Audio={unlock,play};
})();


/* ===== world.js ===== */
(() => {
  const J=window.JBD, C=J.CONFIG, U=J.U;
  function resize(s,canvas){
    const vv=window.visualViewport; const w=Math.max(320,Math.floor(vv?vv.width:innerWidth)),h=Math.max(520,Math.floor(vv?vv.height:innerHeight)); const dpr=Math.min(C.render.maxDpr,devicePixelRatio||1);
    const probe=document.getElementById('safeProbe'); const cs=probe?getComputedStyle(probe):null; s.safe={top:cs?parseFloat(cs.paddingTop)||0:0,bottom:cs?parseFloat(cs.paddingBottom)||0:0};
    s.viewport={w,h,dpr}; canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    s.battlefield.top=s.safe.top;s.battlefield.bottom=h-s.safe.bottom-82;s.bunker.x=w*.5;s.bunker.y=h-s.safe.bottom-C.bunker.yPadding;
    s.input.x=w*.5;s.input.y=h*.45;
    buildLayers(s);
  }
  function buildLayers(s){
    const {w,h,dpr}=s.viewport; for(const key of ['staticCanvas','damageCanvas']){const c=document.createElement('canvas');c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);s[key]=c;s[key==='staticCanvas'?'staticCtx':'damageCtx']=g;}
    drawJungle(s);
  }
  function drawJungle(s){const g=s.staticCtx,{w,h}=s.viewport,r=U.mulberry32(s.seed);
    const grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#606944');grad.addColorStop(.55,'#777453');grad.addColorStop(1,'#5f5c42');g.fillStyle=grad;g.fillRect(0,0,w,h);
    // mottled ground
    for(let i=0;i<420;i++){const x=r()*w,y=r()*h,rr=2+r()*10;g.fillStyle=r()>.5?'rgba(45,51,31,.09)':'rgba(231,218,160,.06)';g.beginPath();g.arc(x,y,rr,0,6.28);g.fill();}
    // central churned lane
    g.strokeStyle='rgba(84,72,48,.22)';g.lineWidth=Math.max(50,w*.18);g.lineCap='round';g.beginPath();g.moveTo(w*.5,-20);g.bezierCurveTo(w*.42,h*.28,w*.58,h*.50,w*.50,h*.86);g.stroke();
    // vegetation clusters at edges
    const shrub=(x,y,sc)=>{g.save();g.translate(x,y);g.scale(sc,sc);g.fillStyle='#293b27';g.strokeStyle='#1c2a1e';g.lineWidth=1;for(let k=0;k<7;k++){const a=k/7*6.28,rx=Math.cos(a)*9,ry=Math.sin(a)*5;g.beginPath();g.ellipse(rx,ry,8,3,a,0,6.28);g.fill();g.stroke();}g.fillStyle='#4f6035';g.beginPath();g.arc(0,0,5,0,6.28);g.fill();g.restore();};
    for(let i=0;i<75;i++){const side=r()<.5?0:1,x=side?r()*(w*.18)+w*.82:r()*w*.18,y=r()*(h-120),sc=.55+r()*.75;shrub(x,y,sc);} 
    // scattered stones/roots

  function drawCharge(ctx,s){const {w,h}=s.viewport;const y=h-s.safe.bottom-66,x=18,bw=w-36,bh=19;ctx.save();ctx.fillStyle='rgba(20,22,18,.86)';ctx.beginPath();ctx.roundRect(x,y,bw,bh,7);ctx.fill();const f=U.clamp(s.input.charge/C.input.maxCharge,0,1);const grad=ctx.createLinearGradient(x,0,x+bw,0);grad.addColorStop(0,'#e8d376');grad.addColorStop(C.input.apCharge/C.input.maxCharge,'#e8d376');grad.addColorStop(C.input.apCharge/C.input.maxCharge+.01,'#8fcef2');grad.addColorStop(C.input.heCharge/C.input.maxCharge,'#8fcef2');grad.addColorStop(C.input.heCharge/C.input.maxCharge+.01,'#e97d38');grad.addColorStop(1,'#e97d38');ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x+2,y+2,(bw-4)*f,bh-4,5);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.strokeRect(x,y,bw,bh);ctx.font='700 9px system-ui';ctx.textAlign='center';ctx.fillStyle='#e7e4d5';ctx.fillText('BURST',x+bw*.12,y+14);ctx.fillText('AP',x+bw*.40,y+14);ctx.fillText('HE',x+bw*.78,y+14);ctx.restore();}
  function render(s,ctx){_state=s;const {w,h,dpr}=s.viewport;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    const trauma=s.trauma*s.trauma,shakeX=(Math.random()-.5)*15*trauma,shakeY=(Math.random()-.5)*12*trauma;ctx.save();ctx.translate(shakeX,shakeY);ctx.drawImage(s.staticCanvas,0,0,w,h);ctx.drawImage(s.damageCanvas,0,0,w,h);
    if(s.debug){ctx.strokeStyle='rgba(0,255,255,.35)';for(const c of s.cover){ctx.beginPath();ctx.arc(c.x,c.y,c.radius,0,6.28);ctx.stroke();}}
    for(const e of s.enemies)drawSoldier(ctx,e);for(const b of s.bullets)if(b.active)drawBullet(ctx,b);for(const e of s.explosions)drawExplosion(ctx,e);J.Particles.render(s,ctx);drawBunker(ctx,s);ctx.restore();drawCrosshair(ctx,s);drawCharge(ctx,s);
    // HUD
    ctx.save();const hy=s.safe.top;ctx.fillStyle='rgba(16,18,14,.72)';ctx.fillRect(0,0,w,hy+44);ctx.font='700 12px system-ui';ctx.fillStyle='#e5e1cc';ctx.fillText('JBD · FOOT PATROL',14,hy+18);ctx.font='10px system-ui';ctx.fillStyle='#aeb49a';ctx.fillText(`BUNKER ${Math.ceil(s.bunker.hp)}%`,14,hy+34);ctx.textAlign='right';ctx.fillText(`KILLS ${s.stats.kills}/${C.level.spawnCount}`,w-14,hy+34);ctx.restore();
    if(s.ui.messageT>0){ctx.save();ctx.textAlign='center';ctx.font='800 18px system-ui';ctx.fillStyle='rgba(245,236,205,.93)';ctx.shadowColor='black';ctx.shadowBlur=6;ctx.fillText(s.ui.message,w/2,h*.19);ctx.restore();}
    if(!s.artillery.finished&&s.mode==='playing'){ctx.save();ctx.textAlign='center';ctx.font='800 15px system-ui';ctx.fillStyle='#e9d8aa';ctx.fillText(s.artillery.t<.42?'DEPLOY':'ARTILLERY INCOMING',w/2,70);ctx.restore();}
    if(s.debug){ctx.save();ctx.font='10px monospace';ctx.fillStyle='#fff';ctx.fillText(`${s.fpsSmoothed.toFixed(0)} FPS  E:${s.enemies.length} P:${s.particles.filter(p=>p.active).length} seed:${s.seed}`,8,h-86);ctx.restore();}
  }
  J.Render={render};
})();


/* ===== main.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG,U=J.U;
  let s,canvas,ctx,deploy,overlay,title,sub,restart;
  function setup(){
    canvas=document.getElementById('game');ctx=canvas.getContext('2d',{alpha:false});deploy=document.getElementById('deploy');overlay=document.getElementById('overlay');title=document.getElementById('title');sub=document.getElementById('sub');restart=document.getElementById('restart');
    s=J.makeState();J.SpriteSystem.init();J.Particles.init(s);J.Combat.init(s);J.World.resize(s,canvas);J.Input.init(s,canvas);window.__JBD_STATE__=s;
    const onResize=()=>J.World.resize(s,canvas);window.addEventListener('resize',onResize,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(onResize,120),{passive:true});
    deploy.addEventListener('click',()=>{J.Audio.unlock(s);s.mode='playing';s.deployed=true;overlay.classList.add('hidden');s.ui.message='DEPLOY';s.ui.messageT=.8;if(C.stress){for(let i=0;i<25;i++)J.Infantry.spawn(s);s.spawn.count=C.level.spawnCount;J.Particles.emit(s,'dirt',s.viewport.w*.5,s.viewport.h*.42,220,{speedMin:20,speedMax:180,life:1.2,gravity:90,size:2});J.Particles.emit(s,'smoke',s.viewport.w*.5,s.viewport.h*.38,80,{speedMin:10,speedMax:90,life:1.8,size:7,vy:-18});}});
    restart.addEventListener('click',()=>location.reload());requestAnimationFrame(loop);
  }
  function update(dt){s.simTime+=dt;s.trauma=Math.max(0,s.trauma-dt*.8);s.ui.messageT=Math.max(0,s.ui.messageT-dt);J.Input.update(s,dt);
    if(s.mode==='playing'){
      J.Combat.updateArtillery(s,dt);
      // start reinforcements before the artillery finishes, then keep pressure rolling
      if(s.artillery.t>C.artillery.introDelay+C.artillery.duration*.72&&s.spawn.count<C.level.spawnCount){s.spawn.t-=dt;if(s.spawn.t<=0){J.Infantry.spawn(s);s.spawn.count++;s.spawn.t=C.level.spawnDuration/C.level.spawnCount*(.68+s.rng()*.48);}}
      J.Infantry.update(s,dt);J.Combat.update(s,dt);
      if(s.spawn.count>=C.level.spawnCount&&s.enemies.every(e=>e.state==='DEAD')){s.completeT+=dt;if(s.completeT>C.level.completeDelay&&!s.levelComplete){s.levelComplete=true;s.mode='complete';showComplete();}}
    } else if(s.mode==='gameover'){J.Infantry.update(s,dt);J.Combat.update(s,dt);showGameOver();}
  }
  function showComplete(){title.textContent='LEVEL 1 SECURE';sub.innerHTML=`Vertical slice cleared · ${s.stats.kills} kills<br><span>Crater cover, artillery, MG/AP/HE en death states actief.</span>`;deploy.style.display='none';restart.style.display='inline-flex';restart.textContent='PLAY AGAIN';overlay.classList.remove('hidden');}
  function showGameOver(){if(!overlay.classList.contains('hidden'))return;title.textContent='BUNKER OVERRUN';sub.textContent='De linie is gebroken.';deploy.style.display='none';restart.style.display='inline-flex';restart.textContent='REDEPLOY';overlay.classList.remove('hidden');}
  function loop(ts){if(!s.lastTs)s.lastTs=ts;let frame=Math.min(C.maxFrameDelta,(ts-s.lastTs)/1000);s.lastTs=ts;s.accumulator+=frame;const inst=1/Math.max(.001,frame);s.fpsSmoothed=U.lerp(s.fpsSmoothed,inst,.05);s.quality=s.fpsSmoothed<48?Math.max(.55,s.quality-.005):Math.min(1,s.quality+.002);
    let steps=0;while(s.accumulator>=C.step&&steps<6){update(C.step);s.accumulator-=C.step;steps++;}J.Render.render(s,ctx);requestAnimationFrame(loop);}
  window.addEventListener('DOMContentLoaded',setup);
})();

</script></body></html>
