/* ===== util.js ===== */
(() => {
  const J = window.JBD;
  J.U = {
    clamp: (v,a,b)=>Math.max(a,Math.min(b,v)),
    lerp: (a,b,t)=>a+(b-a)*t,
    dist2: (a,b)=>{const x=a.x-b.x,y=a.y-b.y; return x*x+y*y;},
    len: (x,y)=>Math.hypot(x,y),
    norm(x,y){const l=Math.hypot(x,y)||1; return {x:x/l,y:y/l};},
    angleLerp(a,b,t){ let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*t; },
    hash(n){ n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4); n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15); return n>>>0; },
    mulberry32(seed){ return function(){ let t=seed+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; },
    gaussian(rng=Math.random){ let u=0,v=0; while(!u)u=rng(); while(!v)v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); },
    rnd(a,b,r=Math.random){ return a+(b-a)*r(); },
    loadJSON(key,fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(_){ return fallback; } },
    saveJSON(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(_){ return false; } }
  };
})();

(() => {

  const THEMES={

    desert:{label:'DESERT', sight:1.12, cover:0.76, vehicleSpeed:0.94, infantrySpeed:0.94, vegetation:0.48, openness:1.18},
    polar:{label:'POLAR', sight:1.04, cover:0.84, vehicleSpeed:1.02, infantrySpeed:0.98, vegetation:0.62, openness:1.16}
  };

  const VEHICLE_PHASES={
    j1:[['technical','truck'],['technical','halftrack'],['truck','stug']],
    j2:[['technical','truck'],['halftrack','technical'],['stug','tank']],
    j3:[['truck','halftrack','technical'],['halftrack','stug'],['tank','stug']],
    d1:[['technical','technical'],['truck','halftrack'],['stug','tank']],
    d2:[['technical','truck','technical'],['halftrack','stug'],['tank','halftrack']],
    d3:[['technical','halftrack','truck'],['stug','tank'],['halftrack','tank','stug']],
    p1:[['halftrack','truck'],['stug','technical'],['tank','stug']],
    p2:[['halftrack','stug','truck'],['tank','technical'],['stug','tank']],
    p3:[['halftrack','stug','truck'],['tank','stug'],['tank','halftrack','stug']]
  };

  const BASE=[
    {theme:'jungle',n:1,seed:81103,inf:9,dur:10.8,veh:'j1',air:0,art:8,river:.34,bridges:[.31,.63],building:.69,trenches:5},
    {theme:'jungle',n:2,seed:81147,inf:11,dur:11.8,veh:'j2',air:3,art:8,river:.62,bridges:[.27,.58],building:.31,trenches:6},
    {theme:'jungle',n:3,seed:81221,inf:13,dur:12.6,veh:'j3',air:3,art:9,river:.43,bridges:[.35,.67],building:.73,trenches:7},
    {theme:'desert',n:1,seed:82105,inf:10,dur:10.2,veh:'d1',air:0,art:7,river:.67,bridges:[.29,.61],building:.28,trenches:4},
    {theme:'desert',n:2,seed:82163,inf:12,dur:11.2,veh:'d2',air:3,art:8,river:.38,bridges:[.24,.56],building:.70,trenches:5},
    {theme:'desert',n:3,seed:82231,inf:14,dur:12.0,veh:'d3',air:3,art:8,river:.58,bridges:[.33,.66],building:.27,trenches:5},
    {theme:'polar',n:1,seed:83119,inf:10,dur:10.4,veh:'p1',air:0,art:7,river:.39,bridges:[.30,.64],building:.72,trenches:4},
    {theme:'polar',n:2,seed:83177,inf:12,dur:11.3,veh:'p2',air:3,art:8,river:.64,bridges:[.26,.57],building:.30,trenches:5},
    {theme:'polar',n:3,seed:83249,inf:14,dur:12.2,veh:'p3',air:3,art:9,river:.46,bridges:[.36,.68],building:.71,trenches:6}
  ];

  function vehicleSchedule(key,cycle){
    const phases=VEHICLE_PHASES[key],out=[];let idx=0;
    const phaseTimes=[5.2,13.2,21.4];
    for(let p=0;p<phases.length;p++)for(let k=0;k<phases[p].length;k++){
      const lane=[-.30,.24,-.08,.32,-.22,.10][idx%6];
      out.push({time:phaseTimes[p]+k*2.15,type:phases[p][k],lane});idx++;
    }
    if(cycle>1&&out.length<8)out.push({time:31.0,type:cycle%2?'stug':'halftrack',lane:.18});
    return out.slice(0,8);
  }

  function get(index=0,cycle=1){
    const b=BASE[((index%BASE.length)+BASE.length)%BASE.length],t=THEMES[b.theme],difficulty=1+(cycle-1)*.12;
    const label=`${t.label} ${b.n}`;
    return {
      index:index%9,cycle,label,theme:b.theme,number:b.n,seed:b.seed+(cycle-1)*997,difficulty,
      infantryCount:b.inf+Math.min(6,(cycle-1)*2),spawnDuration:b.dur*1.45,
      infantrySpeedMult:t.infantrySpeed,infantryRange:C.infantry.range*t.sight,
      coverSearchRadius:C.infantry.coverSearchRadius*(b.theme==='jungle'?1.12:b.theme==='desert'?.90:.96),
      enemyHpMult:difficulty,enemyDamageMult:1+(cycle-1)*.09,enemyFireRateMult:1+(cycle-1)*.055,
      vehicleSpeedMult:t.vehicleSpeed,vehicleHpMult:difficulty,vehicleDamageMult:1+(cycle-1)*.10,vehicleFireRateMult:1+(cycle-1)*.05,
      vehicleSchedule:vehicleSchedule(b.veh,cycle),
      airborneCount:b.air?Math.min(3,b.air):0,airborneStart:23.5,airborneHpMult:difficulty,
      artilleryCount:b.art,artilleryDuration:2.15,
      riverBase:b.river,bridgeRatios:b.bridges,buildingSide:b.building,trenches:b.trenches,
      vegetation:t.vegetation,openness:t.openness
    };
  }

  function resetRuntime(s){
    s.mode='brief';s.simTime=0;s.accumulator=0;s.lastTs=0;s.deployed=false;s.completeT=0;s.levelComplete=false;
    s.bunker.hp=C.bunker.hp;s.bunker.flash=0;s.bunker.recoil=0;s.bunker.muzzle=0;
    s.artillery={started:false,t:0,next:0,index:0,finished:false,events:[]};
    s.assault={armed:false,t:0,whistle:false,pulse:0,lastReleased:0};
    s.enemies=[];s.vehicles=[];s.vehicleShots=[];s.wrecks=[];s.bullets=[];s.explosions=[];s.fires=[];s.cover=[];s.corpses=[];
    s.vehicleWave={started:false,t:0,index:0,finished:false};
    s.airborne={started:false,t:0,finished:false,plane:null,paratroopers:[],collapsed:[],dropped:0};
    s.spawn={t:0,count:0};s.particles=[];s.particleCursor=0;s.trauma=0;s.quality=1;s.levelRewardGranted=false;
    s.stats={shots:0,kills:0,hits:0,vehicleKills:0,armorHits:0,airKills:0,landedParas:0};
    s.ui={messageT:0,message:'',shopDirty:false};s.map=null;
  }

  function apply(s,index=s.campaign.index,cycle=s.campaign.cycle){
    resetRuntime(s);s.campaign.index=index;s.campaign.cycle=cycle;s.scenario=get(index,cycle);s.seed=s.scenario.seed;s.rng=U.mulberry32(s.seed);
    s.statusText=s.scenario.label;s.statusSub=`Cycle ${cycle} · map ${index+1}/9`;
    if(s.scenario.airborneCount===0)s.airborne.finished=true;
    return s.scenario;
  }

  function advance(s){
    s.campaign.cleared++;
    let index=s.campaign.index+1,cycle=s.campaign.cycle;
    if(index>=9){index=0;cycle++;}
    return apply(s,index,cycle);
  }

  J.Scenarios={count:9,get,apply,advance,themes:THEMES};
})();


/* ===== state.js ===== */
(() => {
  const J = window.JBD, C = J.CONFIG;

  function defaultSave(){
    return { supply:0, upgrades:{caliber:0,burst:0,charge:0,he:0,armor:0}, bestCycle:1, totalMapsCleared:0 };
  }

  function sanitizeSave(src){
    const base=defaultSave();
    if(!src||typeof src!=='object')return base;
    base.supply=Math.max(0,src.supply|0);
    base.bestCycle=Math.max(1,src.bestCycle|0||1);
    base.totalMapsCleared=Math.max(0,src.totalMapsCleared|0);
    for(const k of Object.keys(base.upgrades)){
      const max=C.campaign.upgrades[k].max;
      base.upgrades[k]=Math.max(0, Math.min(max, (src.upgrades&&src.upgrades[k])|0));
    }
    return base;
  }

  function loadSave(){ return sanitizeSave(J.U.loadJSON(C.campaign.saveKey, defaultSave())); }
  function saveNow(save){ return J.U.saveJSON(C.campaign.saveKey, sanitizeSave(save)); }

  function buildProfile(up){
    const caliber=up.caliber|0, burst=up.burst|0, charge=up.charge|0, he=up.he|0, armor=up.armor|0;
    return {
      maxHp: C.bunker.hp + armor*18,
      damageReduction: armor*0.08,
      barrelLength: C.bunker.barrelLength + caliber*3,
      sandbags: armor,
      chargeScale: 1 + charge*0.16,
      weapons: {
        mg: { ...C.weapons.mg, burst:C.weapons.mg.burst+burst, cadence:Math.max(0.037,C.weapons.mg.cadence-burst*0.004), damage:C.weapons.mg.damage+caliber*3 },
        ap: { ...C.weapons.ap, damage:C.weapons.ap.damage+caliber*6 },
        he: { ...C.weapons.he, damage:C.weapons.he.damage+caliber*10+he*14, radius:C.weapons.he.radius+he*8 }
      }
    };
  }

  function refreshState(s, resetHp=true){
    s.save = sanitizeSave(s.save||defaultSave());
    s.profile = buildProfile(s.save.upgrades);
    s.bunker.maxHp = s.profile.maxHp;
    if(resetHp) s.bunker.hp = s.profile.maxHp;
    return s.profile;
  }

  function upgradeCost(key, level){
    const cfg=C.campaign.upgrades[key];
    if(level>=cfg.max)return null;
    return cfg.costs[level] ?? null;
  }

  function tryBuyUpgrade(s,key){
    const cfg=C.campaign.upgrades[key];
    if(!cfg)return false;
    const lvl=s.save.upgrades[key]|0, cost=upgradeCost(key,lvl);
    if(cost==null||s.save.supply<cost)return false;
    s.save.supply-=cost;
    s.save.upgrades[key]=lvl+1;
    refreshState(s,false);
    saveNow(s.save);
    return true;
  }

  J.Progress = { defaultSave, loadSave, saveNow, refreshState, upgradeCost, tryBuyUpgrade };

  J.makeState = () => ({
    mode:'brief', time:0, simTime:0, accumulator:0, lastTs:0, deployed:false,
    viewport:{w:390,h:844,dpr:1}, safe:{top:0,bottom:0}, battlefield:{top:0,bottom:0},
    seed:C.level.seed, rng:J.U.mulberry32(C.level.seed), scenario:null, map:null,
    campaign:{index:0,cycle:1,cleared:0},
    save:loadSave(), profile:buildProfile(loadSave().upgrades),
    input:{down:false,x:195,y:360,downAt:0,charge:0,pointerId:null},
    bunker:{x:195,y:730,aim:-Math.PI/2,recoil:0,hp:C.bunker.hp,maxHp:C.bunker.hp,flash:0,muzzle:0,muzzleKind:'mg'},
    artillery:{started:false,t:0,next:0,index:0,finished:false,events:[]},
    assault:{armed:false,t:0,whistle:false,pulse:0,lastReleased:0},
    enemies:[], emplacements:[], vehicles:[], vehicleShots:[], wrecks:[], bullets:[], explosions:[], fires:[], cover:[], corpses:[],
    vehicleWave:{started:false,t:0,index:0,finished:false},
    airborne:{started:false,t:0,finished:false,plane:null,paratroopers:[],collapsed:[],dropped:0},
    spawn:{t:0,count:0}, particles:[], particleCursor:0,
    trauma:0, quality:1, fps:60, fpsSmoothed:60, levelComplete:false, completeT:0, levelRewardGranted:false,
    stats:{shots:0,kills:0,hits:0,vehicleKills:0,armorHits:0,airKills:0,landedParas:0}, debug:C.debug,
    staticCanvas:null, damageCanvas:null, staticCtx:null, damageCtx:null,
    statusText:'TAP DEPLOY', statusSub:'Jungle 1',
    ui:{messageT:0,message:'',shopDirty:false}, audioReady:false
  });
})();


/* ===== sprites.js ===== */
(() => {
  const J=window.JBD;
  const S={stand:[],walk:[],fire:[],crouch:[],prone:[],swim:[],deadFront:null,deadSide:null,bunker:null,vehicles:{},emplacement:null};
  function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

  function helmetTop(g,x,y,w=10,h=8,rot=0){
    g.save();g.translate(x,y);g.rotate(rot);
    g.fillStyle='#465033';g.strokeStyle='#1b2119';g.lineWidth=1.25;
    g.beginPath();g.ellipse(0,0,w*.5,h*.5,0,0,Math.PI*2);g.fill();g.stroke();
    g.strokeStyle='rgba(196,202,157,.25)';g.lineWidth=1;g.beginPath();g.arc(-1,-1,w*.29,Math.PI*1.05,Math.PI*1.75);g.stroke();
    g.fillStyle='#303728';g.beginPath();g.ellipse(0,h*.30,w*.43,h*.12,0,0,Math.PI*2);g.fill();
    g.restore();
  }

  function rifle(g,x,y,angle=-.04,len=24){
    g.save();g.translate(x,y);g.rotate(angle);
    g.strokeStyle='#171b16';g.lineWidth=2.2;g.lineCap='round';g.beginPath();g.moveTo(0,5);g.lineTo(0,-len);g.stroke();

(() => {
  const J=window.JBD, C=J.CONFIG;
  function init(s){s.particles=Array.from({length:C.render.particles},()=>({active:false}));s.particleCursor=0;}
  function emit(s,type,x,y,count,opts={}){
    const q=s.quality;count=Math.max(1,Math.floor(count*q));
    for(let i=0;i<count;i++){
      let p=null;
      for(let tries=0;tries<s.particles.length;tries++){const idx=(s.particleCursor++)%s.particles.length;if(!s.particles[idx].active){p=s.particles[idx];break;}}
      if(!p)return;
      const a=(opts.angle??Math.random()*Math.PI*2)+(Math.random()-.5)*(opts.arc??Math.PI*2),sp=J.U.rnd(opts.speedMin??18,opts.speedMax??95);
      Object.assign(p,{active:true,type,x,y,vx:Math.cos(a)*sp+(opts.vx||0),vy:Math.sin(a)*sp+(opts.vy||0),life:opts.life??J.U.rnd(.25,.8),maxLife:0,size:opts.size??J.U.rnd(1.5,4),rot:Math.random()*6.28,vr:(Math.random()-.5)*7,gravity:opts.gravity??0,alpha:opts.alpha??1});p.maxLife=p.life;
    }

    for(const p of s.particles){
      if(!p.active)continue;p.life-=dt;if(p.life<=0){p.active=false;continue;}p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      if(p.type==='smoke'){p.vx*=.985;p.vy-=5*dt;p.size+=7*dt;}else if(p.type==='fire'){p.size*=.995;}else if(p.type==='muzzle'){p.vx*=.90;p.vy*=.90;}
    }
  }
  function render(s,ctx){
    for(const p of s.particles){
      if(!p.active)continue;
      const t=p.life/p.maxLife,sc=J.Scale?J.Scale.effect(s,p.y):1,ps=Math.max(.35,p.size*sc);
      ctx.globalAlpha=Math.min(1,t*1.7)*p.alpha;
      switch(p.type){
        case 'spark':
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle='#ffd176';ctx.fillRect(-ps*1.2,-.45*sc,ps*2.4,.9*sc);ctx.restore();break;
        case 'dirt':
          ctx.fillStyle=t>.5?'#755932':'#3f3425';ctx.beginPath();ctx.arc(p.x,p.y,ps,0,6.28);ctx.fill();break;
        case 'blood':
          ctx.fillStyle='#6c1612';ctx.beginPath();ctx.arc(p.x,p.y,ps,0,6.28);ctx.fill();break;
        case 'smoke':

/* ===== world.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG,U=J.U;

  function resize(s,canvas){
    const vv=window.visualViewport,w=Math.max(320,Math.floor(vv?vv.width:innerWidth)),h=Math.max(520,Math.floor(vv?vv.height:innerHeight));
    const dpr=Math.min(w<=520?C.render.mobileMaxDpr:C.render.maxDpr,devicePixelRatio||1);
    const probe=document.getElementById('safeProbe'),cs=probe?getComputedStyle(probe):null;
    s.safe={top:cs?parseFloat(cs.paddingTop)||0:0,bottom:cs?parseFloat(cs.paddingBottom)||0:0};
    s.viewport={w,h,dpr};canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    s.battlefield.top=s.safe.top;s.battlefield.bottom=h-s.safe.bottom-82;s.bunker.x=w*.5;s.bunker.y=h-s.safe.bottom-C.bunker.yPadding;
    s.input.x=w*.5;s.input.y=h*.45;buildLayers(s);
  }

  function generateMap(s){
    const {w,h}=s.viewport,sc=s.scenario||J.Scenarios.get(0,1),r=U.mulberry32(sc.seed^0x51f15e);
    const riverWidth=sc.theme==='jungle'?46:sc.theme==='desert'?38:50;
    const map={
      theme:sc.theme,river:{baseX:w*sc.riverBase,width:riverWidth,amp:w*(sc.theme==='jungle'?.075:sc.theme==='desert'?.045:.06),phase:r()*5.2,freq:1.45+r()*.35},
      bridges:sc.bridgeRatios.map((q,i)=>({id:i,y:h*q,halfH:11,width:riverWidth+25})),
      building:null,trenches:[],vegetation:[],rocks:[],roads:[]
    };
    const bunkerRiver=riverXRaw(map,s.bunker.y),safeGap=riverWidth*.5+46,delta=bunkerRiver-w*.5;
    if(Math.abs(delta)<safeGap){const dir=sc.riverBase>=.5?1:-1;map.river.baseX=U.clamp(map.river.baseX+dir*(safeGap-Math.abs(delta)+8),w*.17,w*.83);}
    const bRight=sc.buildingSide>.5,bx=bRight?w*.76:w*.24,by=h*(.40+r()*.12);
    map.building={x:bx,y:by,w:54+r()*12,h:38+r()*8,rot:(r()-.5)*.10};
    for(let i=0;i<sc.trenches;i++){
      let x,y,tries=0;do{x=36+r()*(w-72);y=h*(.23+r()*.46);tries++;}while(tries<18&&Math.abs(x-riverXRaw(map,y))<riverWidth*.85);
      map.trenches.push({x,y,len:24+r()*28,angle:(r()-.5)*.36});
    }
    const vegCount=Math.round((sc.theme==='jungle'?58:sc.theme==='desert'?18:28)*sc.vegetation);
    for(let i=0;i<vegCount;i++){
      let x,y,tries=0;do{x=10+r()*(w-20);y=44+r()*(h-180);tries++;}while(tries<12&&Math.abs(x-riverXRaw(map,y))<riverWidth*.74);
      map.vegetation.push({x,y,scale:.45+r()*.75,kind:sc.theme==='desert'?(r()<.28?'scrub':'rock'):sc.theme==='polar'?(r()<.58?'pine':'rock'):'shrub'});
    }
    const rockCount=sc.theme==='desert'?34:sc.theme==='polar'?24:18;
    for(let i=0;i<rockCount;i++){
      let x=18+r()*(w-36),y=52+r()*(h-190);if(Math.abs(x-riverXRaw(map,y))<riverWidth*.72)x=U.clamp(x+(x<w*.5?-1:1)*riverWidth,16,w-16);
      map.rocks.push({x,y,rx:2+r()*5,ry:1.5+r()*3,rot:r()*3});
    }
    const topX=w*(.18+r()*.64),bridgeA=map.bridges[0],bridgeB=map.bridges[1];
    map.roads=[
      [{x:topX,y:-20},{x:riverXRaw(map,bridgeA.y),y:bridgeA.y},{x:w*.46,y:h*.47},{x:w*.5,y:s.bunker.y-52}],
      [{x:w*(1-sc.riverBase),y:-20},{x:riverXRaw(map,bridgeB.y),y:bridgeB.y},{x:w*.57,y:h*.71},{x:w*.5,y:s.bunker.y-52}]
    ];
    s.map=map;return map;
  }

  function riverXRaw(map,y){return map.river.baseX+Math.sin((y/Math.max(1,innerHeight||844))*Math.PI*map.river.freq+map.river.phase)*map.river.amp;}
  function riverXAt(s,y){const m=s.map;if(!m)return s.viewport.w*.5;return m.river.baseX+Math.sin((y/Math.max(1,s.viewport.h))*Math.PI*m.river.freq+m.river.phase)*m.river.amp;}

  function isInWater(s,x,y){if(!s.map||onBridge(s,y))return false;return Math.abs(x-riverXAt(s,y))<s.map.river.width*.5;}
  function waterSpeed(s,x,y){return isInWater(s,x,y)?.46:1;}

  function buildLayers(s){
    const {w,h,dpr}=s.viewport;
    for(const key of ['staticCanvas','damageCanvas']){const c=document.createElement('canvas');c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);s[key]=c;s[key==='staticCanvas'?'staticCtx':'damageCtx']=g;}

  }

  function palette(theme){
    if(theme==='desert')return {top:'#a98955',mid:'#b79a68',bot:'#92794f',mottleA:'rgba(100,70,38,.09)',mottleB:'rgba(242,220,157,.07)',road:'rgba(105,76,45,.24)',water:'#446d67',waterEdge:'#324f49'};
    if(theme==='polar')return {top:'#b9c6c5',mid:'#d8dcce',bot:'#a7b1ac',mottleA:'rgba(70,87,88,.08)',mottleB:'rgba(255,255,255,.20)',road:'rgba(78,83,80,.16)',water:'#779ea5',waterEdge:'#4f747b'};
    return {top:'#52633d',mid:'#717553',bot:'#555a3f',mottleA:'rgba(37,48,30,.11)',mottleB:'rgba(228,218,159,.055)',road:'rgba(80,66,44,.24)',water:'#355f56',waterEdge:'#29483f'};
  }

  function drawMap(s){
    const g=s.staticCtx,{w,h}=s.viewport,m=s.map,r=U.mulberry32(s.scenario.seed^0x991),p=palette(m.theme);
    const grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,p.top);grad.addColorStop(.55,p.mid);grad.addColorStop(1,p.bot);g.fillStyle=grad;g.fillRect(0,0,w,h);

    for(let i=0;i<dots;i++){const x=r()*w,y=r()*h,rr=1+r()*(m.theme==='polar'?8:10);g.fillStyle=r()>.48?p.mottleA:p.mottleB;g.beginPath();g.arc(x,y,rr,0,6.28);g.fill();}
    drawRiver(g,s,p);drawRoads(g,s,p);drawTrenches(g,s);drawBuilding(g,s);drawVegetation(g,s);drawRocks(g,s);drawBridges(g,s);
  }

  function drawRiver(g,s,p){
    const {h}=s.viewport,m=s.map;g.save();g.lineCap='round';g.lineJoin='round';
    const path=()=>{g.beginPath();for(let y=-30;y<=h+30;y+=18){const x=riverXAt(s,y);y===-30?g.moveTo(x,y):g.lineTo(x,y);}};
    path();g.strokeStyle=p.waterEdge;g.lineWidth=m.river.width+9;g.stroke();path();g.strokeStyle=p.water;g.lineWidth=m.river.width;g.stroke();
    if(m.theme==='polar'){path();g.strokeStyle='rgba(225,242,241,.28)';g.lineWidth=m.river.width*.58;g.stroke();}
    else{path();g.strokeStyle='rgba(211,235,208,.08)';g.lineWidth=3;g.stroke();}

  }

  function drawRoads(g,s,p){
    g.save();g.lineCap='round';for(const road of s.map.roads){g.strokeStyle=p.road;g.lineWidth=s.map.theme==='jungle'?12:16;g.beginPath();g.moveTo(road[0].x,road[0].y);for(let i=1;i<road.length;i++){const a=road[i-1],b=road[i],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;g.quadraticCurveTo(a.x,a.y,mx,my);if(i===road.length-1)g.quadraticCurveTo(mx,my,b.x,b.y);}g.stroke();g.strokeStyle='rgba(235,220,176,.08)';g.lineWidth=2;g.stroke();}g.restore();
  }

  function drawBridges(g,s){

  J.Infantry={spawn,update,damage,findCover,isCraterCovered};
})();

/* ===== main.js ===== */
(() => {
  const J=window.JBD,C=J.CONFIG,U=J.U;
  let s,canvas,ctx,deploy,overlay,title,sub,restart,panel,shop,hint;

  function scenarioBrief(){
    const q=s.scenario,theme=q.theme==='jungle'?'Dichte dekking · korte zichtlijnen':q.theme==='desert'?'Open terrein · lange zichtlijnen':'Open sneeuwveld · snellere voertuigen';
    return `${theme}<br><span>LONG FRONT · ±${C.scale.apparentRangeMeters}m zicht · eerst contact op afstand, daarna close pressure</span><br><span>Tik = BURST · kort vasthouden = AP · lang vasthouden = HE</span>`;
  }

  function ensureShopDom(){
    panel=overlay.querySelector('.panel');
    shop=document.createElement('div');shop.id='shop';shop.className='shop';shop.style.display='none';
    panel.insertBefore(shop,restart);
    hint=panel.querySelector('.hint');
    panel.addEventListener('click',e=>{
      const btn=e.target.closest('[data-upgrade]');
      if(!btn||s.mode!=='complete')return;
      const key=btn.getAttribute('data-upgrade');
      if(J.Progress.tryBuyUpgrade(s,key)){ J.Audio.play('armorImpact',{x:s.viewport.w*.5,variation:Math.random()}); renderShop(); sub.innerHTML=completeSubtext(); }
      else J.Audio.play('ricochet',{x:s.viewport.w*.5,variation:Math.random()});
    });
  }

  function initialiseScenario(index=s.campaign.index,cycle=s.campaign.cycle){
    J.Scenarios.apply(s,index,cycle); J.Progress.refreshState(s,true); J.Particles.init(s); J.Combat.init(s); J.World.resize(s,canvas);
    s.levelRewardGranted=false; title.textContent=s.scenario.label; sub.innerHTML=scenarioBrief(); deploy.style.display='inline-flex'; restart.style.display='none'; deploy.textContent='DEPLOY'; shop.style.display='none'; shop.innerHTML=''; hint.textContent='Verre contacten zijn klein maar hebben royale hitboxes · vuur ook op stofcontacten'; overlay.classList.remove('hidden');
  }

  function startPlaying(){
    J.Audio.unlock(s); s.mode='playing'; s.deployed=true; overlay.classList.add('hidden'); s.ui.message=s.scenario.label; s.ui.messageT=.9;
    if(C.stress){
      for(let i=0;i<25;i++)J.Infantry.spawn(s);
      for(const [i,t] of ['technical','truck','halftrack','stug','tank'].entries())J.Vehicles.spawn(s,t,(i-2)*.12);
      s.vehicleWave.started=true; s.vehicleWave.index=s.scenario.vehicleSchedule.length; s.vehicleWave.finished=true; s.spawn.count=s.scenario.infantryCount;
      if(s.scenario.airborneCount>0)J.Airborne.start(s);else s.airborne.finished=true;
      J.Particles.emit(s,'dirt',s.viewport.w*.5,s.viewport.h*.42,220,{speedMin:20,speedMax:180,life:1.2,gravity:90,size:2});
      J.Particles.emit(s,'smoke',s.viewport.w*.5,s.viewport.h*.38,80,{speedMin:10,speedMax:90,life:1.8,size:7,vy:-18});
    }
  }

  function setup(){
    canvas=document.getElementById('game'); ctx=canvas.getContext('2d',{alpha:false}); deploy=document.getElementById('deploy'); overlay=document.getElementById('overlay'); title=document.getElementById('title'); sub=document.getElementById('sub'); restart=document.getElementById('restart');
    ensureShopDom();
    s=J.makeState(); J.Progress.refreshState(s,true); J.SpriteSystem.init(); J.Input.init(s,canvas); window.__JBD_STATE__=s; initialiseScenario(0,1);
    const onResize=()=>J.World.resize(s,canvas); window.addEventListener('resize',onResize,{passive:true}); window.addEventListener('orientationchange',()=>setTimeout(onResize,120),{passive:true});
    deploy.addEventListener('click',startPlaying);
    restart.addEventListener('click',()=>{
      const wasComplete=s.mode==='complete';
      if(wasComplete)J.Scenarios.advance(s);else J.Scenarios.apply(s,s.campaign.index,s.campaign.cycle);
      J.Progress.refreshState(s,true); J.Particles.init(s); J.Combat.init(s); J.World.resize(s,canvas); startPlaying();
    });
    requestAnimationFrame(loop);
  }

  function rewardForScenario(){
    const themeBonus=s.scenario.theme==='polar'?10:s.scenario.theme==='desert'?6:4;
    const survival=Math.round((s.bunker.hp/(s.bunker.maxHp||1))*12);
    return 20 + s.scenario.number*8 + themeBonus + (s.campaign.cycle-1)*12 + s.stats.vehicleKills*6 + s.stats.airKills*8 + survival;
  }

  function completeSubtext(){
    return `${s.stats.kills} infantry · ${s.stats.vehicleKills} vehicles · ${s.stats.airKills} airborne<br><span>Reward +${s.lastReward||0} supply · totaal ${s.save.supply} supply</span>`;
  }

  function upgradeText(key,lvl){
    switch(key){
      case 'caliber': return `+3 MG dmg · +6 AP dmg · +10 HE dmg per level`;
      case 'burst': return `+1 MG burst per level · iets sneller salvo`;
      case 'charge': return `AP / HE charge ${Math.round((1+(lvl+1)*0.16)*100)}% speed`;
      case 'he': return `HE radius +8 · HE dmg +14 per level`;
      case 'armor': return `Bunker HP +18 · damage resist +8% per level`;
      default: return '';
    }
  }

  function renderShop(){
    const upgrades=C.campaign.upgrades;
    const rows=Object.keys(upgrades).map(key=>{
      const cfg=upgrades[key], lvl=s.save.upgrades[key]|0, cost=J.Progress.upgradeCost(key,lvl), maxed=lvl>=cfg.max, disabled=maxed||s.save.supply<(cost||0);
      return `<button class="shopBtn${disabled?' disabled':''}" ${disabled?'disabled':''} data-upgrade="${key}"><div class="shopTop"><span>${cfg.label}</span><strong>LVL ${lvl}/${cfg.max}</strong></div><div class="shopMeta">${upgradeText(key,lvl)}</div><div class="shopCost">${maxed?'MAXED':`BUY · ${cost} SUPPLY`}</div></button>`;
    }).join('');
    shop.innerHTML=`<div class="shopTitle">FIELD WORKSHOP · LONG FRONT</div><div class="shopGrid">${rows}</div>`;
    shop.style.display='block';
  }

  function update(dt){
    s.simTime+=dt; s.trauma=Math.max(0,s.trauma-dt*.8); s.ui.messageT=Math.max(0,s.ui.messageT-dt); J.Input.update(s,dt);
    if(s.mode==='playing'){
      J.Combat.updateArtillery(s,dt);
      const artDur=s.scenario?.artilleryDuration||C.artillery.duration;
      if(s.artillery.t>C.artillery.introDelay+artDur*.72&&s.spawn.count<s.scenario.infantryCount){ s.spawn.t-=dt; if(s.spawn.t<=0){ J.Infantry.spawn(s); s.spawn.count++; s.spawn.t=s.scenario.spawnDuration/s.scenario.infantryCount*(.68+s.rng()*.48); } }
      J.Infantry.update(s,dt); J.Vehicles.update(s,dt); J.Airborne.update(s,dt); J.Combat.update(s,dt);
      const infantryDone=s.spawn.count>=s.scenario.infantryCount&&s.enemies.every(e=>e.state==='DEAD');
      if(infantryDone&&J.Vehicles.allResolved(s)&&J.Airborne.allResolved(s)){ s.completeT+=dt; if(s.completeT>C.level.completeDelay&&!s.levelComplete){ s.levelComplete=true; s.mode='complete'; showComplete(); } } else s.completeT=0;
    }else if(s.mode==='gameover'){
      J.Infantry.update(s,dt); J.Vehicles.update(s,dt); J.Airborne.update(s,dt); J.Combat.update(s,dt); showGameOver();
    }
  }

  function showComplete(){
    const nextIndex=(s.campaign.index+1)%9, nextCycle=s.campaign.index===8?s.campaign.cycle+1:s.campaign.cycle, next=J.Scenarios.get(nextIndex,nextCycle);
    if(!s.levelRewardGranted){
      s.lastReward=rewardForScenario(); s.save.supply+=s.lastReward; s.save.totalMapsCleared=(s.save.totalMapsCleared||0)+1; s.save.bestCycle=Math.max(s.save.bestCycle||1,nextCycle); J.Progress.saveNow(s.save); s.levelRewardGranted=true;
    }
    title.textContent=`${s.scenario.label} SECURE`; sub.innerHTML=completeSubtext(); deploy.style.display='none'; restart.style.display='inline-flex'; restart.textContent=s.campaign.index===8?'START NEXT CYCLE':'NEXT MAP'; renderShop(); hint.textContent=`Volgende: ${next.label}${nextCycle>s.campaign.cycle?` · CYCLE ${nextCycle}`:''}`; overlay.classList.remove('hidden');
  }

  function showGameOver(){
    if(!overlay.classList.contains('hidden'))return; title.textContent=`${s.scenario.label} · BUNKER OVERRUN`; sub.innerHTML=`De linie is gebroken.<br><span>Herstart dezelfde map. Je upgrades blijven bewaard.</span>`; deploy.style.display='none'; restart.style.display='inline-flex'; restart.textContent='REDEPLOY'; shop.style.display='none'; shop.innerHTML=''; hint.textContent='Tip: gebruik upgrades tussen maps om je bunker sterker te maken'; overlay.classList.remove('hidden');
  }

  function loop(ts){
    if(!s.lastTs)s.lastTs=ts; let frame=Math.min(C.maxFrameDelta,(ts-s.lastTs)/1000); s.lastTs=ts; s.accumulator+=frame; const inst=1/Math.max(.001,frame); s.fpsSmoothed=U.lerp(s.fpsSmoothed,inst,.05); s.quality=s.fpsSmoothed<48?Math.max(.55,s.quality-.005):Math.min(1,s.quality+.002); let steps=0;
    while(s.accumulator>=C.step&&steps<6){ update(C.step); s.accumulator-=C.step; steps++; } J.Render.render(s,ctx); requestAnimationFrame(loop);
  }
  window.addEventListener('DOMContentLoaded',setup);
})();
