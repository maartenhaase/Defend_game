<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#20261b"><title>JBD Milestone 9.1</title><style>html,body,#g{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1f17}#g{position:fixed;inset:0;border:0;display:block}</style></head><body><iframe id="g" allow="autoplay" src="https://raw.githack.com/maartenhaase/Defend_game/ba032a0d74e16411fb0ffda5bc11311a77df79f8/jbd_rebuild_v1/dist/index.html"></iframe><script>
(()=>{const f=document.getElementById('g');f.addEventListener('load',()=>{try{const w=f.contentWindow,J=w.JBD;if(!J||!J.Sprites)return;const D=w.document;
const C=(W,H)=>{const c=D.createElement('canvas');c.width=W;c.height=H;return c};
function man(mode,p=0){const c=C(44,54),g=c.getContext('2d'),s=Math.sin(p),co=Math.cos(p);g.translate(22,27);g.lineCap='round';
 if(mode==='swim'){g.fillStyle='rgba(97,158,174,.32)';g.beginPath();g.ellipse(0,7,15+s*2,4,0,0,6.28);g.fill();g.beginPath();g.ellipse(0,14,11-s*2,2.5,0,0,6.28);g.fill();}
 g.fillStyle='rgba(0,0,0,.20)';g.beginPath();g.ellipse(0,mode==='prone'?13:15,mode==='prone'?8:7,3,0,0,6.28);g.fill();
 if(mode==='prone'){g.strokeStyle='#25291f';g.lineWidth=3;g.beginPath();g.moveTo(-3,7);g.lineTo(-5+s*2,18);g.moveTo(3,7);g.lineTo(5-s*2,18);g.stroke();g.fillStyle='#56603f';g.strokeStyle='#1d2119';g.lineWidth=1.2;g.beginPath();g.roundRect(-6,-5,12,17,3);g.fill();g.stroke();g.fillStyle='#3f4931';g.beginPath();g.roundRect(-5,1,10,8,2);g.fill();g.stroke();g.strokeStyle='#20231c';g.lineWidth=2.4;g.beginPath();g.moveTo(3,-2);g.lineTo(4,-18);g.stroke();g.fillStyle='#735035';g.fillRect(2.8,-15,2.5,10);g.fillStyle='#4d5834';g.strokeStyle='#20241d';g.beginPath();g.ellipse(0,-9,6,5,0,0,6.28);g.fill();g.stroke();return c;}
 const crouch=mode==='crouch',swim=mode==='swim';const bob=swim?0:s*(mode==='walk'?.8:.2),stride=mode==='walk'?s*3.8:0;
 g.strokeStyle='#24281f';g.lineWidth=3; if(!swim){g.beginPath();g.moveTo(-2,7);g.lineTo(-4+stride*.4,18);g.moveTo(2,7);g.lineTo(4-stride*.4,18);g.stroke();}
 g.fillStyle='#56603f';g.strokeStyle='#1d2119';g.lineWidth=1.2;g.beginPath();g.roundRect(-7,-5+bob,14,crouch?13:16,4);g.fill();g.stroke();g.fillStyle='#414b32';g.beginPath();g.roundRect(-5,1+bob,10,8,2);g.fill();g.stroke();
 g.strokeStyle='#59633e';g.lineWidth=3;g.beginPath();g.moveTo(-4,-3+bob);g.lineTo(-8-co*2,5+bob);g.moveTo(4,-3+bob);g.lineTo(8+co*2,4+bob);g.stroke();
 g.strokeStyle='#20231c';g.lineWidth=2.5;g.beginPath();g.moveTo(3,-2+bob);g.lineTo(4,-19+bob);g.stroke();g.fillStyle='#735035';g.fillRect(2.8,-16+bob,2.5,10);
 g.fillStyle='#4d5834';g.strokeStyle='#20241d';g.beginPath();g.ellipse(0,-10+bob,6.3,5.2,0,0,6.28);g.fill();g.stroke();g.fillStyle='#879064';g.globalAlpha=.35;g.beginPath();g.ellipse(-1,-12+bob,4,1.5,-.2,0,6.28);g.fill();g.globalAlpha=1;return c;}
 const arr=(n,m)=>Array.from({length:n},(_,i)=>man(m,i/n*Math.PI*2));J.Sprites.walk=arr(8,'walk');J.Sprites.crouch=arr(4,'crouch');J.Sprites.prone=arr(6,'prone');J.Sprites.swim=arr(6,'swim');
 J.Sprites.deadFront=man('prone',.8);J.Sprites.deadSide=man('prone',2.2);
 const old=J.Render.render;J.Render.render=(s,c)=>{const keep=[];for(const e of s.enemies||[]){if(e.state==='DEAD')continue;keep.push([e,e.pose,e.anim,e.pronePreference]);if(e.inWater)e.pose='swim';else if(e.state==='ADVANCE'||e.state==='SPRINT_TO_COVER')e.pose='walk';else if(e.state==='IN_COVER'&&!e.cover){e.pose='walk';e.anim=0;e.pronePreference=false;}else if(e.cover&&e.suppression>.55)e.pose='prone';}old(s,c);for(const [e,p,a,pr] of keep){e.pose=p;e.anim=a;e.pronePreference=pr;}};
 console.log('JBD Milestone 9.1 infantry visual patch active');}catch(e){console.error(e)}})})();
</script></body></html>
