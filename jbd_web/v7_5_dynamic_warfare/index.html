<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#20251b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JBD — V7.5 Dynamic Warfare</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#171b14;color:#eee8d3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{position:fixed;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#657258}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(rgba(18,21,15,.48),rgba(12,14,10,.82));z-index:5;transition:opacity .18s ease}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(92vw,440px);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:rgba(30,35,25,.96);border:1px solid rgba(235,225,190,.27);border-radius:16px;padding:22px 20px;box-shadow:0 18px 55px rgba(0,0,0,.42)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;color:#adb995}.panel h1{font-size:27px;line-height:1.04;margin:8px 0 10px;letter-spacing:-.025em}.panel p{margin:0 0 16px;color:#c7c8b6;font-size:13px;line-height:1.5}.action{width:100%;appearance:none;-webkit-appearance:none;border:0;border-radius:11px;background:#d3b960;color:#1c2018;font-weight:900;letter-spacing:.06em;font-size:13px;min-height:48px;padding:13px 16px;touch-action:manipulation}.action:active{transform:translateY(1px)}#restart{display:none}.hint{margin-top:12px;color:#89927b;font-size:10px;line-height:1.45}.shop{display:none;margin:6px 0 14px}.shopTitle{font-size:12px;font-weight:900;letter-spacing:.12em;color:#d9c878;margin:12px 0 8px}.supply{font-size:12px;color:#ece4c3;margin-bottom:10px}.shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shopBtn{appearance:none;-webkit-appearance:none;border:1px solid rgba(235,225,190,.18);border-radius:10px;background:#343c2b;color:#eee8d3;text-align:left;padding:10px;min-height:72px}.shopBtn.disabled{opacity:.42}.shopBtn strong{display:block;font-size:11px;letter-spacing:.03em}.shopBtn span{display:block;font-size:10px;color:#abb19e;margin-top:4px;line-height:1.25}.shopBtn em{display:block;font-style:normal;font-size:10px;color:#dbc46f;margin-top:6px;font-weight:800}.summary{display:none;margin:0 0 12px;padding:10px 11px;border:1px solid rgba(235,225,190,.12);border-radius:10px;background:rgba(0,0,0,.13);font-size:11px;line-height:1.45;color:#bdc2ae}#safeProbe{position:fixed;pointer-events:none;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:390px){.panel{padding:18px 16px}.shopGrid{grid-template-columns:1fr}.shopBtn{min-height:62px}.panel h1{font-size:24px}}
</style>
</head>
<body>
<div id="safeProbe"></div>
<canvas id="game"></canvas>
<div id="overlay" class="overlay">
  <div class="panel">
    <div class="eyebrow">JBD // CLEAN REBUILD</div>
    <h1 id="title">V7.5 · DYNAMIC WARFARE</h1>
    <p id="sub">Minder swarm, meer variatie: dynamische encounters, echte stances, zigzaggende tanks, berm-drops, gore, vuurballen en iPhone-audio.</p>
    <div id="summary" class="summary"></div>
    <div id="shop" class="shop"><div class="shopTitle">FIELD WORKSHOP</div><div id="supply" class="supply"></div><div id="shopGrid" class="shopGrid"></div></div>
    <button id="deploy" class="action" type="button">DEPLOY</button>
    <button id="restart" class="action" type="button">PLAY AGAIN</button>
    <div class="hint">Tik = MG burst · kort vasthouden = AP · langer vasthouden = HE</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
