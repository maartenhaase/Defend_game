<!doctype html>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11170f;color:#eee4c6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}

.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));background:linear-gradient(rgba(9,13,9,.38),rgba(9,13,9,.82))}
.overlay.hidden{display:none}.panel{width:min(92vw,430px);padding:22px;border:1px solid rgba(245,224,163,.25);border-radius:16px;background:rgba(26,32,23,.96);box-shadow:0 18px 55px rgba(0,0,0,.48);text-align:center}

<body>
<div class="safe" id="safe"></div>
<canvas id="game"></canvas>
<div class="overlay" id="overlay"><div class="panel"><div class="eyebrow">JBD · ROUTE TANK</div><h1 id="title">V7.1 ROUTE TANK</h1><p id="sub">De tank rijdt automatisch <b>omhoog</b> over de route. Jij bent de gunner.<br><span>Tik = MG burst · kort vasthouden = AP · lang vasthouden = HE. Richt met je vinger of muis.</span></p><button id="deploy" class="action" type="button">DEPLOY</button><div class="hint">zoomed-out view · road-aligned hull · turret aim · engine + weapon audio</div></div></div>
<script>
'use strict';
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const overlay=document.getElementById('overlay'),deploy=document.getElementById('deploy'),title=document.getElementById('title'),sub=document.getElementById('sub'),safeProbe=document.getElementById('safe');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a=1,b=0)=>b+(a-b)*Math.random();
const START_Y=3990,END_Y=430;
const CFG={step:1/60,maxDelta:.1,worldW:900,worldH:4400,roadW:110,playerSpeed:46,zoom:.82,chunkH:520,render:{mobileDpr:1.2,desktopDpr:1.45,particles:260,bullets:110},heat:{mg:.13,ap:.24,he:.36,cool:.31,lock:.93,unlock:.30},weapon:{mg:{speed:690,damage:19,range:430},ap:{speed:820,damage:70,range:650},he:{speed:540,damage:110,range:560,radius:70}}};
const S={mode:'brief',w:390,h:844,dpr:1,safeTop:0,safeBottom:0,time:0,acc:0,last:0,cameraX:0,cameraY:0,shake:0,player:{y:START_Y,x:450,angle:0,turret:0,hp:100,maxHp:100,heat:0,locked:false,gateT:0,muzzle:0,recoil:0},input:{x:195,y:270,down:false,t0:0,charge:'MG'},bullets:[],particles:[],enemies:[],vehicles:[],buildings:[],cover:[],chunks:new Map(),shots:0,hits:0,kills:0,reached:false,spawned:new Set(),enemyTracers:[]};

function roadX(y){return CFG.worldW*.5 + Math.sin(y/350)*105 + Math.sin(y/135)*28 + Math.sin(y/810)*42;}
function roadHeadingUp(y){const d=8,dx=roadX(y-d)-roadX(y+d);return Math.atan2(dx,2*d);}
function roadHeadingDown(y){return roadHeadingUp(y)+Math.PI;}
function resize(){const vv=window.visualViewport,w=Math.max(320,Math.floor(vv?vv.width:innerWidth)),h=Math.max(520,Math.floor(vv?vv.height:innerHeight)),cs=getComputedStyle(safeProbe);S.safeTop=parseFloat(cs.paddingTop)||0;S.safeBottom=parseFloat(cs.paddingBottom)||0;S.w=w;S.h=h;S.dpr=Math.min(w<=520?CFG.render.mobileDpr:CFG.render.desktopDpr,devicePixelRatio||1);canvas.width=Math.round(w*S.dpr);canvas.height=Math.round(h*S.dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.imageSmoothingEnabled=false;buildChunks();}
function worldToScreen(x,y){return{x:(x-S.cameraX)*CFG.zoom,y:(y-S.cameraY)*CFG.zoom};}
function screenToWorld(x,y){return{x:x/CFG.zoom+S.cameraX,y:y/CFG.zoom+S.cameraY};}
function visible(x,y,m=100){const p=worldToScreen(x,y);return p.x>-m&&p.x<S.w+m&&p.y>-m&&p.y<S.h+m;}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

const sprites={};
function buildSprites(){
  const px=(w,h,draw)=>{const c=makeCanvas(w,h),g=c.getContext('2d');g.imageSmoothingEnabled=false;draw(g,w,h);return c;};
  sprites.playerHull=px(40,62,(g)=>{g.fillStyle='#11160f';g.fillRect(3,6,8,50);g.fillRect(29,6,8,50);g.fillStyle='#262d22';for(let y=8;y<55;y+=7){g.fillRect(4,y,6,4);g.fillRect(30,y,6,4)}g.fillStyle='#526142';g.fillRect(11,7,18,48);g.fillStyle='#748257';g.fillRect(13,10,14,39);g.fillStyle='#3a4434';g.fillRect(14,17,12,24);g.fillStyle='#96a277';g.fillRect(17,8,6,7);g.fillStyle='#171c16';g.fillRect(17,43,6,8)});
  sprites.truck=px(34,50,(g)=>{g.fillStyle='#121611';g.fillRect(5,4,24,42);g.fillStyle='#596247';g.fillRect(7,6,20,38);g.fillStyle='#7b8260';g.fillRect(9,8,16,12);g.fillStyle='#343b2e';g.fillRect(9,22,16,19);g.fillStyle='#1b2019';g.fillRect(3,9,5,10);g.fillRect(26,9,5,10);g.fillRect(3,31,5,10);g.fillRect(26,31,5,10)});
  sprites.halftrack=px(38,54,(g)=>{g.fillStyle='#111510';g.fillRect(5,4,28,46);g.fillStyle='#515d44';g.fillRect(7,6,24,42);g.fillStyle='#737d59';g.fillRect(10,8,18,18);g.fillStyle='#343b2c';g.fillRect(9,28,20,17);g.fillStyle='#1e241b';g.fillRect(3,24,6,21);g.fillRect(29,24,6,21);g.fillStyle='#8c9468';g.fillRect(15,18,8,8)});
  sprites.enemyTank=px(42,58,(g)=>{g.fillStyle='#111510';g.fillRect(4,5,8,48);g.fillRect(30,5,8,48);g.fillStyle='#424c3d';g.fillRect(12,7,18,44);g.fillStyle='#626d50';g.fillRect(14,10,14,32);g.fillStyle='#7c8560';g.fillRect(15,21,12,13);g.fillStyle='#262d22';g.fillRect(18,24,6,7)});
  const inf=(body,accent)=>px(16,22,(g)=>{g.fillStyle='#11140f';g.fillRect(5,1,6,5);g.fillStyle=accent;g.fillRect(4,2,8,3);g.fillStyle=body;g.fillRect(4,6,8,9);g.fillStyle='#2c3326';g.fillRect(4,15,3,6);g.fillRect(9,15,3,6);g.fillStyle='#c6ad89';g.fillRect(6,4,4,3);g.fillStyle='#222820';g.fillRect(10,8,6,2)});
  sprites.rifle=inf('#62724c','#98a46d');sprites.marksman=inf('#566553','#b9d9d8');sprites.smg=inf('#67734e','#e7be69');sprites.lmg=inf('#596346','#c98a46');sprites.engineer=inf('#665b42','#9b7048');
  const bld=(kind,lit=false)=>px(kind==='barn'?72:kind==='shed'?48:58,kind==='barn'?58:46,(g,w,h)=>{g.fillStyle='#11140f';g.fillRect(2,8,w-4,h-10);g.fillStyle=lit?'#4d4c35':'#777351';g.fillRect(5,13,w-10,h-18);g.fillStyle=kind==='barn'?'#4b3224':'#54382a';g.beginPath();g.moveTo(2,13);g.lineTo(w/2,2);g.lineTo(w-2,13);g.closePath();g.fill();g.fillStyle='#1c2119';g.fillRect(w/2-5,h-19,10,14);g.fillStyle=lit?'#f1c960':'#242a23';g.fillRect(10,21,8,6);g.fillRect(w-18,21,8,6)});
  for(const k of ['house','barn','shed']){sprites[k]=bld(k,false);sprites[k+'Lit']=bld(k,true)}
  sprites.tree=px(28,36,(g)=>{g.fillStyle='#171b14';g.fillRect(12,19,5,16);g.fillStyle='#30452e';g.fillRect(5,10,18,18);g.fillStyle='#4f653c';g.fillRect(8,5,13,16);g.fillStyle='#75824f';g.fillRect(10,6,5,6)});
  sprites.rock=px(30,20,(g)=>{g.fillStyle='#171915';g.fillRect(3,8,24,9);g.fillStyle='#666657';g.fillRect(6,5,18,10);g.fillStyle='#a09a78';g.fillRect(8,4,8,4)});
}
buildSprites();

function addBuilding(x,y,kind='house'){S.buildings.push({x,y,kind,occupant:null});S.cover.push({x,y,r:34,type:'building'});}
function seedWorld(){S.enemies.length=0;S.vehicles.length=0;S.buildings.length=0;S.cover.length=0;S.spawned.clear();
  const places=[[3470,-150,'house'],[3425,145,'house'],[3375,200,'barn'],[2860,-175,'house'],[2810,-115,'shed'],[2750,155,'house'],[2700,210,'barn'],[2150,-175,'house'],[2080,-110,'house'],[2010,165,'shed'],[1940,210,'house'],[1300,-145,'house'],[1240,160,'barn']];
  for(const [y,off,k] of places)addBuilding(roadX(y)+off,y,k);
  for(let y=700;y<3850;y+=150){const side=Math.sin(y*.071)>0?1:-1;S.cover.push({x:roadX(y)+side*(105+rnd(145,60)),y:y+rnd(45,-45),r:20,type:(y%450<160?'tree':'rock')});}
  S.encounters=[{y:3570,type:'crossing',count:4},{y:3320,type:'rifle',count:3},{y:3400,type:'village',count:5},{y:3060,type:'truck',count:1},{y:2830,type:'marksman',count:3},{y:2760,type:'village',count:6},{y:2470,type:'halftrack',count:1},{y:2240,type:'crossing',count:5},{y:2040,type:'village',count:6},{y:1690,type:'tank',count:1},{y:1430,type:'rifle',count:5},{y:1180,type:'last',count:7}];
}
seedWorld();

function drawLandscapeChunk(index){const cs=.5,c=makeCanvas(Math.round(CFG.worldW*cs),Math.round(CFG.chunkH*cs)),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(cs,cs);const y0=index*CFG.chunkH;g.fillStyle='#34452f';g.fillRect(0,0,CFG.worldW,CFG.chunkH);for(let i=0;i<16;i++){const x=(i*149+index*57)%CFG.worldW,y=(i*93+index*71)%CFG.chunkH,w=85+((i*33)%120),h=45+((i*21)%75);g.fillStyle=i%2?'#3d5034':'#2d402b';g.fillRect(x,y,w,h)}if(index%2===0){g.fillStyle='#556344';g.fillRect(34,72,190,122);g.fillStyle='#6d724d';for(let x=44;x<214;x+=15)g.fillRect(x,78,3,109)}if(index%3===1){g.fillStyle='#49583b';g.fillRect(650,255,205,138);g.fillStyle='#686b49';for(let y=265;y<383;y+=14)g.fillRect(662,y,180,2)}const pts=[];for(let ly=-20;ly<=CFG.chunkH+20;ly+=10){const wy=y0+ly;pts.push([roadX(wy),ly])}g.strokeStyle='#242b22';g.lineWidth=CFG.roadW+12;g.lineJoin='round';g.lineCap='round';g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.strokeStyle='#746b50';g.lineWidth=CFG.roadW;g.stroke();g.strokeStyle='#938765';g.lineWidth=CFG.roadW-14;g.stroke();g.strokeStyle='rgba(218,200,143,.18)';g.lineWidth=2;g.setLineDash([12,17]);g.stroke();g.setLineDash([]);const fence=(wy)=>{const ly=wy-y0;if(ly<-30||ly>CFG.chunkH+30)return;const rx=roadX(wy);g.strokeStyle='#252a23';g.lineWidth=6;g.beginPath();g.moveTo(18,ly);g.lineTo(rx-48,ly);g.moveTo(rx+48,ly);g.lineTo(CFG.worldW-18,ly);g.stroke();g.strokeStyle='#9b8a5c';g.lineWidth=2;for(let x=24;x<CFG.worldW-24;x+=20){if(Math.abs(x-rx)<52)continue;g.beginPath();g.moveTo(x,ly-8);g.lineTo(x,ly+8);g.stroke()}};fence(4050);fence(520);return c;}
function buildChunks(){S.chunks.clear()}
function getChunk(i){if(i<0||i>=Math.ceil(CFG.worldH/CFG.chunkH))return null;if(!S.chunks.has(i))S.chunks.set(i,drawLandscapeChunk(i));return S.chunks.get(i)}
function trimChunkCache(start,end){for(const k of [...S.chunks.keys()])if(k<start-1||k>end+1)S.chunks.delete(k)}

const A={ctx:null,master:null,engineOsc:null,engineGain:null,noise:null};
function initAudio(){if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;A.ctx=new AC();A.master=A.ctx.createGain();A.master.gain.value=.32;A.master.connect(A.ctx.destination);A.engineOsc=A.ctx.createOscillator();A.engineOsc.type='sawtooth';A.engineOsc.frequency.value=47;A.engineGain=A.ctx.createGain();A.engineGain.gain.value=.025;const lp=A.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;A.engineOsc.connect(lp).connect(A.engineGain).connect(A.master);A.engineOsc.start();const len=A.ctx.sampleRate*.12,b=A.ctx.createBuffer(1,len,A.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=b;}
function tone(freq,dur=.08,type='square',gain=.08,slide=0){if(!A.ctx)return;const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+slide),t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(A.master);o.start(t);o.stop(t+dur+.02)}
function noiseBurst(dur=.08,gain=.08,cutoff=1500){if(!A.ctx||!A.noise)return;const t=A.ctx.currentTime,s=A.ctx.createBufferSource(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();s.buffer=A.noise;f.type='lowpass';f.frequency.value=cutoff;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(A.master);s.start(t);s.stop(t+dur)}
function sfx(kind){if(kind==='mg'){for(let i=0;i<3;i++)setTimeout(()=>{noiseBurst(.045,.12,2100);tone(135,.035,'square',.04,-35)},i*48)}else if(kind==='ap'){noiseBurst(.10,.16,1200);tone(82,.13,'sawtooth',.10,-34)}else if(kind==='he'){noiseBurst(.18,.20,700);tone(54,.20,'sawtooth',.12,-22)}else if(kind==='hit'){tone(320,.04,'square',.025,-100)}else if(kind==='enemy'){noiseBurst(.035,.03,1800)}}
function updateAudio(){if(!A.ctx||!A.engineOsc)return;A.engineOsc.frequency.setTargetAtTime(47+Math.sin(S.time*8)*2.5,A.ctx.currentTime,.08);A.engineGain.gain.setTargetAtTime(S.mode==='playing'?.030:.006,A.ctx.currentTime,.1)}

function spawnEnemy(classKey,x,y,opts={}){S.enemies.push({classKey,x,y,hp:classKey==='lmg'?78:classKey==='engineer'?72:60,state:opts.state||'idle',dir:opts.dir||1,speed:classKey==='smg'?24:18,fire:1.2+rnd(2.8),cover:null,building:opts.building||null,muzzle:0,dead:false})}
function spawnEncounter(e){if(S.spawned.has(e.y))return;S.spawned.add(e.y);const rx=roadX(e.y);if(e.type==='crossing'){for(let i=0;i<e.count;i++){const left=i%2===0;spawnEnemy(i===0?'smg':i===1?'lmg':'rifle',rx+(left?-195:195)+rnd(26,-26),e.y+i*15,{state:'cross',dir:left?1:-1})}}else if(e.type==='rifle'||e.type==='marksman'){for(let i=0;i<e.count;i++){const k=e.type==='marksman'?(i===0?'marksman':'rifle'):(i===2?'marksman':'rifle');spawnEnemy(k,rx+(i%2?-1:1)*(125+i*20),e.y+i*22,{state:'cover'})}}else if(e.type==='village'){const near=S.buildings.filter(b=>Math.abs(b.y-e.y)<150);for(let i=0;i<e.count;i++){const b=near[i%Math.max(1,near.length)],k=['rifle','marksman','engineer','rifle','lmg'][i%5];if(b){spawnEnemy(k,b.x,b.y,{state:'building',building:b});b.occupant=S.enemies[S.enemies.length-1]}else spawnEnemy(k,rx+rnd(160,-160),e.y+rnd(90,-90),{state:'cover'})}}else if(e.type==='truck'||e.type==='halftrack'||e.type==='tank'){S.vehicles.push({type:e.type,x:rx+rnd(18,-18),y:e.y,hp:e.type==='tank'?240:e.type==='halftrack'?145:100,dead:false,fire:1.8+rnd(2),angle:roadHeadingDown(e.y)})}else if(e.type==='last'){for(let i=0;i<e.count;i++)spawnEnemy(['rifle','marksman','lmg','engineer'][i%4],rx+(i%2?-1:1)*(95+rnd(120)),e.y+rnd(120,-90),{state:'cover'});S.vehicles.push({type:'halftrack',x:rx,y:e.y-70,hp:150,dead:false,fire:1.5,angle:roadHeadingDown(e.y)})}}

function firePlayer(kind,target){if(S.player.locked)return;const wc=CFG.weapon[kind];S.player.heat=Math.min(1.1,S.player.heat+CFG.heat[kind]);if(S.player.heat>=CFG.heat.lock)S.player.locked=true;S.shots++;S.player.muzzle=.09;S.player.recoil=kind==='he'?7:kind==='ap'?4:2;S.shake=Math.max(S.shake,kind==='he'?7:kind==='ap'?4:1.8);sfx(kind);const muzzle={x:S.player.x+Math.sin(S.player.turret)*31,y:S.player.y-Math.cos(S.player.turret)*31},dx=target.x-muzzle.x,dy=target.y-muzzle.y,count=kind==='mg'?3:1;for(let i=0;i<count;i++){const spread=kind==='mg'?(i-1)*.024:0,ang=Math.atan2(dy,dx)+spread;S.bullets.push({kind,x:muzzle.x,y:muzzle.y,px:muzzle.x,py:muzzle.y,vx:Math.cos(ang)*wc.speed,vy:Math.sin(ang)*wc.speed,life:wc.range/wc.speed,hit:false})}}
function hitEntity(b){const wc=CFG.weapon[b.kind];for(const e of S.enemies){if(e.dead||e.building)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<13){e.hp-=wc.damage;S.hits++;b.hit=true;sfx('hit');if(e.hp<=0){e.dead=true;S.kills++;burst(e.x,e.y,'blood',8)}return true}}for(const v of S.vehicles){if(v.dead)continue;if(Math.hypot(v.x-b.x,v.y-b.y)<25){v.hp-=wc.damage*(b.kind==='mg'?.22:1);S.hits++;b.hit=true;sfx('hit');if(v.hp<=0){v.dead=true;S.kills++;burst(v.x,v.y,'fire',20);noiseBurst(.18,.11,650)}return true}}for(const e of S.enemies){if(e.dead||!e.building)continue;if(Math.hypot(e.building.x-b.x,e.building.y-b.y)<34&&b.kind==='he'){e.hp-=wc.damage*.9;S.hits++;b.hit=true;if(e.hp<=0){e.dead=true;e.building.occupant=null;S.kills++}return true}}return false;}
function burst(x,y,type,n){for(let i=0;i<n&&S.particles.length<CFG.render.particles;i++){const a=Math.random()*TAU,sp=rnd(type==='fire'?110:70,20);S.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(35),life:rnd(.8,.28),t:0,type})}}
function updateBullets(dt){for(const b of S.bullets){b.px=b.x;b.py=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(!b.hit&&hitEntity(b)&&b.kind!=='he')b.life=0;if(b.kind==='he'&&b.life<=0&&!b.hit){burst(b.x,b.y,'fire',18);noiseBurst(.16,.09,700);const wc=CFG.weapon.he;for(const e of S.enemies){if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<wc.radius){e.hp-=wc.damage;if(e.hp<=0){e.dead=true;if(e.building)e.building.occupant=null;S.kills++}}}}}S.bullets=S.bullets.filter(b=>b.life>0).slice(-CFG.render.bullets)}
function updateParticles(dt){for(const p of S.particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=45*dt;p.vx*=.985}S.particles=S.particles.filter(p=>p.t<p.life).slice(-CFG.render.particles)}

function enemyFire(e){const d=Math.hypot(S.player.x-e.x,S.player.y-e.y),range=e.classKey==='marksman'?470:e.classKey==='rifle'?330:e.classKey==='lmg'?210:e.classKey==='smg'?155:230;if(d>range)return;const chance=e.classKey==='marksman'?.28:e.classKey==='rifle'?.20:e.classKey==='lmg'?.15:.11;if(Math.random()<chance){S.player.hp=Math.max(0,S.player.hp-(e.classKey==='marksman'?7:e.classKey==='lmg'?4:3));S.shake=Math.max(S.shake,2.5);if(S.player.hp<=0)gameOver()}S.enemyTracers.push({x:e.x,y:e.y,tx:S.player.x+rnd(20,-20),ty:S.player.y+rnd(20,-20),t:0,life:.11,classKey:e.classKey});e.muzzle=.10;sfx('enemy')}
function nearestCover(e){let best=null,bd=1e9;for(const c of S.cover){const d=Math.hypot(c.x-e.x,c.y-e.y);if(d<130&&d<bd){best=c;bd=d}}return best}
function updateEnemies(dt){for(const e of S.enemies){if(e.dead)continue;e.muzzle=Math.max(0,e.muzzle-dt);const dP=Math.hypot(S.player.x-e.x,S.player.y-e.y);if(e.building){e.x=e.building.x;e.y=e.building.y;e.fire-=dt;if(e.fire<=0){if(e.classKey==='marksman'||e.classKey==='rifle'||(e.classKey==='lmg'&&dP<210))enemyFire(e);e.fire=e.classKey==='marksman'?rnd(7,4):e.classKey==='rifle'?rnd(6,3.4):rnd(5,3)}continue}if(e.state==='cross'){e.x+=e.dir*e.speed*dt;if(Math.abs(e.x-roadX(e.y))<65&&Math.random()<.012){const c=nearestCover(e);if(c){e.state='moveCover';e.cover=c}}}else if(e.state==='moveCover'&&e.cover){const dx=e.cover.x-e.x,dy=e.cover.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*1.35*dt;e.y+=dy/d*e.speed*1.35*dt;if(d<7)e.state='cover'}else if(e.state!=='cover'){if(!e.cover&&Math.random()<.006)e.cover=nearestCover(e);if(e.cover)e.state='moveCover'}e.fire-=dt;if(e.fire<=0){if(e.classKey==='marksman'||e.classKey==='rifle'||(e.classKey==='lmg'&&dP<210)||(e.classKey==='smg'&&dP<155))enemyFire(e);e.fire=e.classKey==='marksman'?rnd(8,5):e.classKey==='rifle'?rnd(6,3.7):e.classKey==='lmg'?rnd(5,3):rnd(4,2.6)}}for(const tr of S.enemyTracers)tr.t+=dt;S.enemyTracers=S.enemyTracers.filter(t=>t.t<t.life)}
function updateVehicles(dt){for(const v of S.vehicles){if(v.dead)continue;v.angle=roadHeadingDown(v.y);v.fire-=dt;const d=Math.hypot(S.player.x-v.x,S.player.y-v.y);if(v.fire<=0&&d<(v.type==='tank'?470:310)){if(Math.random()<(v.type==='tank'?.22:.14)){S.player.hp=Math.max(0,S.player.hp-(v.type==='tank'?12:6));S.shake=Math.max(S.shake,4);if(S.player.hp<=0)gameOver()}S.enemyTracers.push({x:v.x,y:v.y,tx:S.player.x+rnd(18,-18),ty:S.player.y+rnd(18,-18),t:0,life:.14,classKey:'vehicle'});sfx('enemy');v.fire=v.type==='tank'?rnd(5,3.7):rnd(3,2.1)}}}

function update(dt){if(S.mode!=='playing'){updateAudio();return}S.time+=dt;S.player.gateT+=dt;S.player.muzzle=Math.max(0,S.player.muzzle-dt);S.player.recoil=Math.max(0,S.player.recoil-28*dt);S.shake=Math.max(0,S.shake-12*dt);S.player.heat=Math.max(0,S.player.heat-CFG.heat.cool*dt);if(S.player.locked&&S.player.heat<=CFG.heat.unlock)S.player.locked=false;if(S.player.gateT>.8&&!S.reached){S.player.y-=CFG.playerSpeed*dt;S.player.x=roadX(S.player.y);S.player.angle=roadHeadingUp(S.player.y)}const aimW=screenToWorld(S.input.x,S.input.y);S.player.turret=Math.atan2(aimW.x-S.player.x,S.player.y-aimW.y);S.cameraY=S.player.y-(S.h*.73)/CFG.zoom;S.cameraX=S.player.x-(S.w*.50)/CFG.zoom;const ahead=S.h/CFG.zoom*.92;for(const e of S.encounters)if(e.y>S.player.y-ahead&&e.y<S.player.y+120)spawnEncounter(e);updateBullets(dt);updateParticles(dt);updateEnemies(dt);updateVehicles(dt);updateAudio();if(S.player.y<=END_Y&&!S.reached){S.reached=true;S.mode='complete';showComplete()}}

function drawChunkedWorld(){const viewTop=S.cameraY,viewBottom=S.cameraY+S.h/CFG.zoom,maxI=Math.ceil(CFG.worldH/CFG.chunkH)-1,start=Math.max(0,Math.floor(viewTop/CFG.chunkH)-1),end=Math.min(maxI,Math.ceil(viewBottom/CFG.chunkH)+1);for(let i=start;i<=end;i++){const ch=getChunk(i);if(!ch)continue;const p=worldToScreen(0,i*CFG.chunkH);ctx.drawImage(ch,(0-S.cameraX)*CFG.zoom,p.y,CFG.worldW*CFG.zoom,CFG.chunkH*CFG.zoom)}trimChunkCache(start,end)}
function drawStaticObjects(){for(const c of S.cover){if(!visible(c.x,c.y,80))continue;const p=worldToScreen(c.x,c.y);if(c.type==='tree')ctx.drawImage(sprites.tree,Math.round(p.x-14*CFG.zoom),Math.round(p.y-30*CFG.zoom),sprites.tree.width*CFG.zoom,sprites.tree.height*CFG.zoom);else if(c.type==='rock')ctx.drawImage(sprites.rock,Math.round(p.x-15*CFG.zoom),Math.round(p.y-10*CFG.zoom),sprites.rock.width*CFG.zoom,sprites.rock.height*CFG.zoom)}for(const b of S.buildings){if(!visible(b.x,b.y,100))continue;const p=worldToScreen(b.x,b.y),spr=sprites[b.kind+(b.occupant&&!b.occupant.dead?'Lit':'')]||sprites[b.kind],w=spr.width*CFG.zoom,h=spr.height*CFG.zoom;ctx.drawImage(spr,Math.round(p.x-w/2),Math.round(p.y-h/2),w,h)}}
function drawEnemies(){for(const e of S.enemies){if(e.dead||e.building||!visible(e.x,e.y,55))continue;const p=worldToScreen(e.x,e.y),spr=sprites[e.classKey]||sprites.rifle,w=spr.width*CFG.zoom,h=spr.height*CFG.zoom;ctx.drawImage(spr,Math.round(p.x-w/2),Math.round(p.y-h/2),w,h);if(e.muzzle>0){ctx.fillStyle='#ffd86c';ctx.fillRect(Math.round(p.x+6),Math.round(p.y-5),4,3)}}for(const e of S.enemies){if(e.dead||!e.building||!visible(e.x,e.y,85))continue;const p=worldToScreen(e.x,e.y);if(e.muzzle>0){ctx.fillStyle='#ffe08a';ctx.fillRect(Math.round(p.x+12),Math.round(p.y-5),6,3)}}}
function drawVehicles(){for(const v of S.vehicles){if(!visible(v.x,v.y,110))continue;const p=worldToScreen(v.x,v.y),spr=v.type==='truck'?sprites.truck:v.type==='halftrack'?sprites.halftrack:sprites.enemyTank;ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.rotate(v.angle);ctx.globalAlpha=v.dead?.48:1;ctx.drawImage(spr,-spr.width*CFG.zoom/2,-spr.height*CFG.zoom/2,spr.width*CFG.zoom,spr.height*CFG.zoom);ctx.restore()}ctx.globalAlpha=1}
function drawPlayer(){const p=worldToScreen(S.player.x,S.player.y),spr=sprites.playerHull;ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.rotate(S.player.angle);ctx.drawImage(spr,-spr.width*CFG.zoom/2,-spr.height*CFG.zoom/2,spr.width*CFG.zoom,spr.height*CFG.zoom);ctx.restore();ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.rotate(S.player.turret);ctx.translate(0,S.player.recoil*CFG.zoom);ctx.fillStyle='#182017';ctx.fillRect(-6*CFG.zoom,-7*CFG.zoom,12*CFG.zoom,14*CFG.zoom);ctx.fillStyle='#8d9a6d';ctx.fillRect(-5*CFG.zoom,-16*CFG.zoom,10*CFG.zoom,15*CFG.zoom);ctx.fillStyle='#77855f';ctx.fillRect(-2*CFG.zoom,-34*CFG.zoom,4*CFG.zoom,22*CFG.zoom);if(S.player.muzzle>0){ctx.fillStyle='#ffe27a';ctx.fillRect(-5*CFG.zoom,-42*CFG.zoom,10*CFG.zoom,8*CFG.zoom);ctx.fillStyle='#fff1b3';ctx.fillRect(-2*CFG.zoom,-48*CFG.zoom,4*CFG.zoom,7*CFG.zoom)}ctx.restore()}
function drawProjectiles(){for(const b of S.bullets){const a=worldToScreen(b.px,b.py),p=worldToScreen(b.x,b.y);ctx.strokeStyle=b.kind==='he'?'#ff9640':b.kind==='ap'?'#b9e4ee':'#f1d46d';ctx.lineWidth=b.kind==='mg'?2:3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke()}for(const t of S.enemyTracers){const a=worldToScreen(t.x,t.y),b=worldToScreen(t.tx,t.ty),u=clamp(t.t/t.life,0,1),u0=Math.max(0,u-.11),x1=lerp(a.x,b.x,u0),y1=lerp(a.y,b.y,u0),x2=lerp(a.x,b.x,u),y2=lerp(a.y,b.y,u);ctx.strokeStyle=t.classKey==='marksman'?'#d7f1ec':t.classKey==='vehicle'?'#ff9a4a':'#e6c66c';ctx.lineWidth=t.classKey==='vehicle'?3:2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}}
function drawParticles(){for(const p of S.particles){if(!visible(p.x,p.y,45))continue;const q=worldToScreen(p.x,p.y),a=1-p.t/p.life;ctx.globalAlpha=a;ctx.fillStyle=p.type==='fire'?(p.t%0.15<.075?'#ef7e32':'#d9b55a'):'#8a2f2b';ctx.fillRect(Math.round(q.x),Math.round(q.y),p.type==='fire'?4:3,p.type==='fire'?4:3)}ctx.globalAlpha=1}
function chargeKind(){if(!S.input.down)return null;const hold=(performance.now()-S.input.t0)/1000;return hold<.18?'MG':hold<.55?'AP':'HE'}
function drawHUD(){ctx.fillStyle='rgba(12,16,11,.88)';ctx.fillRect(0,0,S.w,S.safeTop+52);ctx.font='700 10px monospace';ctx.fillStyle='#e5c66d';ctx.fillText('JBD V7.1 · ROUTE TANK',12,S.safeTop+15);ctx.fillStyle='#c7c99e';ctx.font='9px monospace';ctx.fillText(`HP ${Math.ceil(S.player.hp)}/${S.player.maxHp}`,12,S.safeTop+32);const progress=clamp((START_Y-S.player.y)/(START_Y-END_Y),0,1);ctx.fillText(`${Math.round(progress*100)}% · KILLS ${S.kills}`,S.w-112,S.safeTop+32);const by=S.h-S.safeBottom-39,bw=S.w-28;ctx.fillStyle='rgba(12,16,11,.85)';ctx.fillRect(14,by,bw,15);ctx.fillStyle=S.player.locked?'#d05c3d':'#d9b95c';ctx.fillRect(16,by+2,(bw-4)*S.player.heat,11);ctx.fillStyle='#f0e2b4';ctx.font='700 8px monospace';ctx.fillText(S.player.locked?'BARREL HOT':'HEAT',20,by+11);const kind=chargeKind();ctx.strokeStyle=kind==='HE'?'#ff9b49':kind==='AP'?'#b9e4ee':'#e6dcae';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(S.input.x,S.input.y,9,0,TAU);ctx.moveTo(S.input.x-13,S.input.y);ctx.lineTo(S.input.x+13,S.input.y);ctx.moveTo(S.input.x,S.input.y-13);ctx.lineTo(S.input.x,S.input.y+13);ctx.stroke();if(kind){ctx.font='700 9px monospace';ctx.fillStyle=kind==='HE'?'#ffb165':kind==='AP'?'#cdebf1':'#f1dc86';ctx.fillText(kind,S.input.x+15,S.input.y-12);const hold=clamp((performance.now()-S.input.t0)/1000,0,.8);ctx.fillRect(S.input.x-13,S.input.y+17,26*clamp(hold/.55,0,1),2)}ctx.font='700 8px monospace';ctx.fillStyle='#bfc39f';ctx.fillText('TAP MG  ·  HOLD AP  ·  LONG HOLD HE',16,S.h-S.safeBottom-48)}
function render(){ctx.setTransform(S.dpr,0,0,S.dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,S.w,S.h);const sx=S.shake?rnd(S.shake,-S.shake):0,sy=S.shake?rnd(S.shake,-S.shake):0;ctx.save();ctx.translate(sx,sy);drawChunkedWorld();drawStaticObjects();drawVehicles();drawEnemies();drawProjectiles();drawParticles();drawPlayer();ctx.restore();drawHUD()}

function loop(ts){if(!S.last)S.last=ts;const dt=Math.min(CFG.maxDelta,(ts-S.last)/1000);S.last=ts;S.acc+=dt;while(S.acc>=CFG.step){update(CFG.step);S.acc-=CFG.step}render();requestAnimationFrame(loop)}
function start(){initAudio();S.mode='playing';S.time=0;S.last=performance.now();overlay.classList.add('hidden');S.player={y:START_Y,x:roadX(START_Y),angle:roadHeadingUp(START_Y),turret:0,hp:100,maxHp:100,heat:0,locked:false,gateT:0,muzzle:0,recoil:0};S.input.down=false;S.bullets.length=0;S.particles.length=0;S.enemyTracers.length=0;S.shots=S.hits=S.kills=0;S.reached=false;seedWorld();buildChunks()}
function showComplete(){title.textContent='CAMP B REACHED';const eff=S.shots?Math.round(S.hits/S.shots*100):100;sub.innerHTML=`Route secure.<br><span>${S.kills} targets · fire efficiency ${eff}% · tank HP ${Math.ceil(S.player.hp)}</span>`;deploy.textContent='REDEPLOY';overlay.classList.remove('hidden')}
function gameOver(){S.mode='gameover';title.textContent='TANK DISABLED';const progress=Math.round(clamp((START_Y-S.player.y)/(START_Y-END_Y),0,1)*100);sub.innerHTML=`De colonne is gestopt.<br><span>Bereikte afstand ${progress}%.</span>`;deploy.textContent='REDEPLOY';overlay.classList.remove('hidden')}
function bind(){const pos=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?.[0]||e;S.input.x=clamp(p.clientX-r.left,0,S.w);S.input.y=clamp(p.clientY-r.top,0,S.h)};canvas.addEventListener('pointerdown',e=>{if(S.mode!=='playing')return;initAudio();pos(e);S.input.down=true;S.input.t0=performance.now();e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(S.mode!=='playing')return;pos(e);e.preventDefault()},{passive:false});const release=e=>{if(S.mode!=='playing'||!S.input.down)return;pos(e);S.input.down=false;const hold=(performance.now()-S.input.t0)/1000,target=screenToWorld(S.input.x,S.input.y);firePlayer(hold<.18?'mg':hold<.55?'ap':'he',target);e.preventDefault()};canvas.addEventListener('pointerup',release,{passive:false});canvas.addEventListener('pointercancel',e=>{S.input.down=false;e.preventDefault()},{passive:false});const go=e=>{e.preventDefault();start()};deploy.addEventListener('pointerup',go,{passive:false});deploy.addEventListener('click',e=>{e.preventDefault();if(S.mode!=='playing')start()});window.addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize)}
resize();bind();requestAnimationFrame(loop);
})();
</script>
