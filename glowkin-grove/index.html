<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07140f">
  <title>Glowkin Grove</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07140f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
    #status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:28px;font-size:18px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="./payload0.js"></script>
  <script src="./payload1.js"></script>
  <script src="./payload2.js"></script>
  <script src="./payload3.js"></script>
</head>
<body>
<div id="status">Glowkin Grove laden…</div>
<script>
(()=>{
  const status=document.getElementById('status');
  try{
    if(!window.pako) throw new Error('De laadmodule kon niet starten');
    const parts=[window.GLOWKIN_PART_0,window.GLOWKIN_PART_1,window.GLOWKIN_PART_2,window.GLOWKIN_PART_3];
    if(parts.some(x=>!x)) throw new Error('Gamegegevens ontbreken');
    const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.textContent='Kon de game niet laden: '+e.message;
  }
})();
</script>
</body>
</html>
