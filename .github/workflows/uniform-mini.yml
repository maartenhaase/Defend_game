name: Apply JBD Uniform Mini Scale

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uniform-mini.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixed mini scale to current game
        run: python jbd_rebuild_v1/apply_uniform_mini.py

      - name: Verify uniform scale settings
        run: |
          grep -q "function progress(){return 1;}" jbd_rebuild_v1/src/scale.js
          grep -q "mobileScale: 0.44" jbd_rebuild_v1/src/config.js
          grep -q "speed: 16" jbd_rebuild_v1/src/config.js
          grep -q "dustRevealEnd: 0.00" jbd_rebuild_v1/src/config.js
          grep -q "MINI FRONT" jbd_rebuild_v1/build.js

      - name: Build and syntax check
        run: |
          cd jbd_rebuild_v1
          node build.js
          for f in src/*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('dist/index.html','utf8');
          const m=html.match(/<script>"use strict";\n([\s\S]*)\n<\/script>/);
          if(!m) throw new Error('bundle missing');
          fs.writeFileSync('/tmp/jbd-uniform-mini.js',m[1]);
          NODE
          node --check /tmp/jbd-uniform-mini.js

      - name: Publish uniform mini build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jbd_rebuild_v1/build.js jbd_rebuild_v1/src jbd_rebuild_v1/dist/index.html
          if git diff --cached --quiet; then
            echo "uniform mini build already current"
            exit 0
          fi
          git commit -m "Replace Long Front LOD with uniform mini scale"
          git push
