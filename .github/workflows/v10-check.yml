name: V10.8 campaign, damage and milestone upgrades tests
on:
  push:
    branches: [main]
    paths:
      - 'jbd_web/v10/**'
      - '.github/workflows/v10-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: iPhone canvas and all 30 progressive missions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V10 JavaScript
        run: node --check jbd_web/v10/game.js
      - name: Validate 30 maps, nine-stage damage, medics, loot, shrapnel and Next Map
        run: node jbd_web/v10/v10_regression.cjs

      - name: Compile the V10.8 game and verify scheduled upgrade integration
        run: |
          mkdir -p /tmp/jbd-v108
          node jbd_web/v10/build_v108.cjs --output /tmp/jbd-v108/game.js
          cp jbd_web/v10/index.html /tmp/jbd-v108/index.html
          node --check /tmp/jbd-v108/game.js
          JBD_GAME_DIR=/tmp/jbd-v108 node jbd_web/v10/v108_regression.cjs
