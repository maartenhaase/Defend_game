name: Publish JBD Milestone 9 exact build

on:
  push:
    branches: ["jbd-m9-release"]
    paths:
      - "jbd_rebuild_v1/release_m9/**"
      - ".github/workflows/m9-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jbd-m9-release
      - name: Reconstruct exact tested standalone
        run: |
          cat jbd_rebuild_v1/release_m9/chunk0.b64 jbd_rebuild_v1/release_m9/chunk1.b64 jbd_rebuild_v1/release_m9/chunk2.b64 | base64 -d > /tmp/jbd-m9.html.gz
          gzip -dc /tmp/jbd-m9.html.gz > jbd_rebuild_v1/dist/index.html
          echo "05f265b14faf09c1a11ae0637521d79b2b38bd2125b66cef8824bf997008b9af  jbd_rebuild_v1/dist/index.html" | sha256sum -c -
      - name: Verify bundled JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('jbd_rebuild_v1/dist/index.html','utf8');
          const m=html.match(/<script>"use strict";\n([\s\S]*)\n<\/script>/);
          if(!m) throw new Error('Bundled script not found');
          fs.writeFileSync('/tmp/jbd-m9-bundle.js',m[1]);
          NODE
          node --check /tmp/jbd-m9-bundle.js
      - name: Commit exact release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jbd_rebuild_v1/dist/index.html
          if git diff --cached --quiet; then
            echo "Dist already exact"
          else
            git commit -m "Publish JBD Milestone 9 exact standalone"
            git push origin HEAD:jbd-m9-release
          fi
