name: Deploy JBD to GitHub Pages
# Retry after GitHub Pages source was enabled

on:
  push:
    branches: ["main"]
    paths:
      - "jbd_rebuild_v1/dist/**"
      - "jbd_web/**"
      - "handpan-studio/**"
      - "acid-rhythm-lab/**"
      - "warehouse95/**"
      - "cantique-adventure/**"
      - "stay-together/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -a jbd_rebuild_v1/dist/. _site/
          cp -a jbd_web _site/jbd_web
          cp -a handpan-studio _site/handpan-studio
          cp -a acid-rhythm-lab _site/acid-rhythm-lab
          cp -a warehouse95 _site/warehouse95
          cp -a cantique-adventure _site/cantique-adventure
          cp -a stay-together _site/stay-together
          test -s _site/stay-together/index.html
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          # Public-domain Wikimedia Commons speech excerpts, transcoded to MP3 for Safari.
          mkdir -p _site/warehouse95/speech
          curl -fL -sS --retry 3 --retry-delay 2 --max-time 90 "https://upload.wikimedia.org/wikipedia/commons/3/35/First_Inauguration_of_FDR_-_Fear_Itself_Excerpt.ogg" -o /tmp/warehouse-fdr.ogg
          curl -fL -sS --retry 3 --retry-delay 2 --max-time 90 "https://upload.wikimedia.org/wikipedia/commons/4/41/Kennedy_berliner.ogg" -o /tmp/warehouse-berliner.ogg
          curl -fL -sS --retry 3 --retry-delay 2 --max-time 90 "https://upload.wikimedia.org/wikipedia/commons/8/8d/Discurso_de_Kennedy.ogg" -o /tmp/warehouse-moon.ogg
          for excerpt in fdr berliner moon; do
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "/tmp/warehouse-${excerpt}.ogg" -ar 32000 -ac 1 -codec:a libmp3lame -q:a 4 "_site/warehouse95/speech/${excerpt}.mp3"
            test -s "_site/warehouse95/speech/${excerpt}.mp3"
          done
          test -s _site/cantique-adventure/index.html
          test -s _site/cantique-adventure/sem-v15/index.html
          test -s _site/cantique-adventure/sem-v14/v15-sprites.js
          test -s _site/cantique-adventure/sem-v14/assets/v15_sem_idle_right.webp
          test -s _site/warehouse95/index.html
          node -e 'const fs=require("fs");const h=fs.readFileSync("_site/warehouse95/index.html","utf8");const js=h.split("<script>")[1]?.split("</script>")[0]||"";if(js.length<25000)throw Error("Warehouse95 JS incomplete");new Function(js);for(const s of ["function acidHit(","function drumHit(","function sampleHit(","function polyHit(","speech/fdr.mp3","speech/moon.mp3"])if(!js.includes(s))throw Error("Missing "+s);console.log("Warehouse95 Web Audio syntax OK");'
          # CC0 recordings: FreePats Hang D minor, recorded 2017.
          # We transcode FLAC to MP3 for reliable iPhone/Safari playback.
          mkdir -p _site/handpan-studio/samples
          for tone in A3 A4 Bb4 C5 D4 D5 E4 F4 G4; do
            curl -fLsS --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/freepats/hang-D-minor/main/samples/${tone}_01.flac" -o "/tmp/handpan-${tone}.flac"
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "/tmp/handpan-${tone}.flac" -codec:a libmp3lame -q:a 3 "_site/handpan-studio/samples/${tone}.mp3"
            test -s "_site/handpan-studio/samples/${tone}.mp3"
          done
          test -s _site/handpan-studio/index.html
          test -s _site/acid-rhythm-lab/index.html
          # Check inline HTML5 synthesizer JavaScript before publishing.
          node -e 'const fs=require("fs");const h=fs.readFileSync("_site/handpan-studio/index.html","utf8");const js=h.split("<script>")[1]?.split("</script>")[0]||"";if(js.length<10000)throw Error("Handpan JS missing");new Function(js);console.log("Handpan JavaScript syntax OK")'
          node -e 'const fs=require("fs");let h=fs.readFileSync("_site/handpan-studio/index.html","utf8");if(!h.includes("vevor10")||!h.includes("patera432")||!h.includes("layoutAlert"))throw Error("Handpan models/layout missing")'
          touch _site/.nojekyll
          test -s _site/jbd_web/v9_9_26/index.html
          test -s _site/jbd_web/v9_9_26/game.js
          node --check _site/jbd_web/v9_9_26/game.js
          test -s _site/jbd_web/v9_9_19/index.html
          test -s _site/jbd_web/v9_9_19/game.js
          node --check _site/jbd_web/v9_9_19/game.js
          test -s _site/jbd_web/v9_9_26/index.html
          test -s _site/jbd_web/v9_9_26/game.js
          node --check _site/jbd_web/v9_9_26/game.js
          node _site/jbd_web/v9_8_2/demo_smoke_test.cjs
          node _site/jbd_web/v9_8_2/symmetry_test.cjs
          test -s _site/jbd_web/v9_9_43/index.html
          test -s _site/jbd_web/v9_9_43/game.js
          node --check _site/jbd_web/v9_9_43/game.js
          node _site/jbd_web/v9_9_43/battle_regression.cjs
          node _site/jbd_web/v9_9_43/field_regression.cjs
          node _site/jbd_web/v9_9_43/support_balance.cjs _site/jbd_web/v9_9_43 3 --verify > /tmp/jbd-support-balance.json
          echo 'Confirmed V9.9.43 in Pages artifact'
          test -s _site/jbd_web/v9_9_44/index.html
          test -s _site/jbd_web/v9_9_44/game.js
          node --check _site/jbd_web/v9_9_44/game.js
          # V44 changed prone and cover behavior; the V43 movement benchmark no longer applies.
          node _site/jbd_web/v9_9_44/field_regression.cjs _site/jbd_web/v9_9_44
          echo 'Confirmed V9.9.44 in Pages artifact'
          test -s _site/jbd_web/v9_9_45/index.html
          test -s _site/jbd_web/v9_9_45/game.js
          node --check _site/jbd_web/v9_9_45/game.js
          node --check _site/jbd_web/v9_9_45/balance_regression.cjs
          node _site/jbd_web/v9_9_45/balance_regression.cjs _site/jbd_web/v9_9_45
          echo 'Confirmed V9.9.45 verified artifact'
          test -s _site/jbd_web/v9_9_46/index.html
          test -s _site/jbd_web/v9_9_46/game.js
          node --check _site/jbd_web/v9_9_46/game.js
          node --check _site/jbd_web/v9_9_46/vehicle_regression.cjs
          node _site/jbd_web/v9_9_46/vehicle_regression.cjs _site/jbd_web/v9_9_46
          echo 'Confirmed V9.9.46 field balance and mobility tests'
          test -s _site/jbd_web/v9_9_47/index.html
          test -s _site/jbd_web/v9_9_47/game.js
          node --check _site/jbd_web/v9_9_47/game.js
          node --check _site/jbd_web/v9_9_47/regression.cjs
          node _site/jbd_web/v9_9_47/regression.cjs _site/jbd_web/v9_9_47
          echo 'Confirmed V9.9.47 combat and sandbox smoke tests'
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Allow Pages artifact indexing
        run: sleep 22
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published V9.9.47
        run: |
          URL='https://maartenhaase.github.io/Defend_game/jbd_web/v9_9_47/index.html'
          for i in 1 2 3 4 5; do
            STATUS=$(curl -L -s -o /tmp/jbd-page.html -w '%{http_code}' "$URL" || true)
            echo "HTTP status: $STATUS"
            if [ "$STATUS" = '200' ] && grep -q 'V9.9.47' /tmp/jbd-page.html; then
              JS_STATUS=$(curl -L -s -o /tmp/jbd-game.js -w '%{http_code}' 'https://maartenhaase.github.io/Defend_game/jbd_web/v9_9_47/game.js' || true)
              if [ "$JS_STATUS" = '200' ]; then echo 'V9.9.47 HTML and JS verified live'; exit 0; fi
            fi
            sleep 5
          done
          echo 'Published V9.9.47 URL is not available'
          exit 1



