name: Deploy JBD Web to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web_v6/**"
      - "jbd_rebuild_v1/src/**"
      - "jbd_rebuild_v1/build.js"
      - "jbd_rebuild_v1/dist/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build JBD rebuild standalone release
        run: |
          cd jbd_rebuild_v1
          node build.js
          cd ..
          mkdir -p web_v6/jbd_rebuild_v1
          cp jbd_rebuild_v1/dist/index.html web_v6/jbd_rebuild_v1/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web_v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
