<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11191c">
<title>SEM in Cantique — iPhone</title>
<style>
html,body{margin:0;min-height:100%;background:#10181c;color:#f8f6ee;font:16px/1.5 system-ui,sans-serif}
body{display:grid;place-items:center;text-align:center}
main{max-width:430px;padding:28px}
h1{font-size:23px}p{color:#c5cfcb}
.spinner{margin:20px auto;width:32px;height:32px;border-radius:50%;border:3px solid #f0d18438;border-top-color:#f0d184;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main><h1>SEM in Cantique</h1><div class="spinner"></div><p id="status">De spelwereld wordt geladen…</p></main>
<script>
(async function(){
  try {
    const files=Array.from({length:15},(_,i)=>'data/part'+String(i).padStart(2,'0')+'.txt');
    let ready=0;
    const text=await Promise.all(files.map(async p=>{
      const response=await fetch(p,{cache:'force-cache'});
      if(!response.ok)throw new Error('Kon '+p+' niet laden ('+response.status+')');
      const result=await response.text();
      ready++;
      document.getElementById('status').textContent='Spelbestanden laden: '+Math.round(ready/files.length*100)+'%';
      return result;
    }));
    const html=text.join('');
    if(!html.includes('SEM in Cantique')||!html.includes('</html>')) throw new Error('Onvolledige spelbestanden');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('status').textContent='Laden mislukt: '+err.message+'. Vernieuw de pagina.';
  }
})();
</script>
</body></html>
